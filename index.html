<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRUSA3S FILAMENT</title>
    <style>
        :root { --bg-color: #050505; --neon-cyan: #00f2ff; --neon-blue: #0080ff; --neon-yellow: #f9d71c; --segment-off: #1a1a1a; }
        body { background-color: var(--bg-color); color: var(--neon-cyan); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-transform: uppercase; }
        .dashboard { border: 4px solid var(--neon-blue); padding: 40px; box-shadow: 0 0 20px var(--neon-blue); background: rgba(0, 0, 0, 0.9); text-align: center; min-width: 320px; }
        .glitch-title { font-size: 1rem; color: var(--neon-blue); margin-bottom: 20px; border-bottom: 1px solid var(--neon-blue); padding-bottom: 5px; letter-spacing: 2px; }
        .bar-container { display: flex; gap: 5px; margin-bottom: 25px; justify-content: center; }
        .segment { width: 12px; height: 35px; background-color: var(--segment-off); border: 1px solid #111; transition: all 0.3s; }
        .segment.on { background-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .stats { font-size: 3.5rem; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); margin: 10px 0; }
        #mat-label { font-size: 1.2rem; color: var(--neon-yellow); margin-bottom: 20px; display: block; }
        .data-grid { margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 8px; text-align: left; border-top: 1px solid var(--neon-blue); padding-top: 15px; }
        .data-item { font-size: 0.8rem; }
        .data-label { color: var(--neon-blue); margin-right: 10px; }
        .data-value { color: #fff; }
        button { margin-top: 20px; background: none; border: 1px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer; font-family: inherit; font-size: 0.6rem; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="glitch-title">VÁHA FILAMENTU</div>
        <div class="bar-container" id="pixel-bar"></div>
        <div class="main-display">
            <div class="stats"><span id="weight-val">0</span>g</div>
            <span id="mat-label">ČAKÁM NA LINK...</span>
        </div>
        <div class="data-grid">
            <div class="data-item"><span class="data-label">HEX:</span><span id="data-hex" class="data-value">---</span></div>
            <div class="data-item"><span class="data-label">LENGTH:</span><span id="data-len" class="data-value">---</span> m</div>
            <div class="data-item"><span class="data-label">ID:</span><span id="data-id" class="data-value">---</span></div>
        </div>
        <button onclick="resetLink()">PRENASTAVIŤ LINK</button>
    </div>

    <script>
        const barContainer = document.getElementById('pixel-bar');
        for (let i = 0; i < 20; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment';
            barContainer.appendChild(seg);
        }

        function resetLink() {
            const newLink = prompt("Vlož svoj Google CSV link:");
            if (newLink) {
                localStorage.setItem('myCsvUrl', newLink);
                location.reload();
            }
        }

        async function updateData() {
            const csvUrl = localStorage.getItem('myCsvUrl');
            if (!csvUrl) {
                document.getElementById('mat-label').innerText = "KLIKNI NA TLAČIDLO DOLE A VLOŽ LINK";
                return;
            }

            try {
                const response = await fetch(csvUrl + "&t=" + new Date().getTime());
                const text = await response.text();
                const allRows = text.trim().split(/\r?\n/);
                
                let validRows = allRows.filter(row => {
                    const cols = row.split(',');
                    return cols[4] && cols[4].replace(/"/g, '').trim() !== "" && cols[4].replace(/"/g, '').trim() !== "0";
                });

                if (validRows.length === 0) return;
                const lastRow = validRows[validRows.length - 1].split(',');

                const vaha = parseFloat((lastRow[4] || "0").replace(/"/g, '').replace(',', '.'));
                const material = (lastRow[2] || "---").replace(/"/g, '');
                let hex = (lastRow[3] || "00f2ff").replace(/"/g, '').trim();
                if (!hex.startsWith('#')) hex = '#' + hex;

                document.getElementById('weight-val').innerText = Math.round(vaha);
                document.getElementById('mat-label').innerText = material;
                document.getElementById('data-hex').innerText = hex;
                document.getElementById('data-len').innerText = (lastRow[5] || "---").replace(/"/g, '');
                document.getElementById('data-id').innerText = (lastRow[0] || "---").replace(/"/g, '');

                document.documentElement.style.setProperty('--neon-cyan', hex);
                const activeSegments = Math.round(((vaha / 1000) * 100 / 100) * 20);
                const segments = document.querySelectorAll('.segment');
                segments.forEach((seg, index) => {
                    if (index < activeSegments) {
                        seg.classList.add('on');
                        seg.style.backgroundColor = hex;
                        seg.style.boxShadow = `0 0 10px ${hex}`;
                    } else {
                        seg.classList.remove('on');
                        seg.style.backgroundColor = '';
                        seg.style.boxShadow = '';
                    }
                });
            } catch (e) { console.error(e); }
        }

        if (!localStorage.getItem('myCsvUrl')) {
            setTimeout(resetLink, 500);
        }

        setInterval(updateData, 15000);
        updateData();
    </script>
</body>
</html>
