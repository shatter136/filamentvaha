<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>GSI DASHBOARD FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Teko:wght@500&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Segment';
            src: url('https://db.onlinewebfonts.com/t/788933667104a37f02f0a1c137456d2a.woff2') format('woff2');
        }
        :root { --cyan: #00f2ff; --yellow: #f4d03f; --bg: #000; }
        body { background: var(--bg); color: var(--cyan); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; }
        
        .dashboard { width: 750px; padding: 45px; border: 4px solid var(--cyan); box-shadow: 0 0 40px var(--cyan), inset 0 0 20px rgba(0,242,255,0.2); background: #000; }
        
        /* GSI BAR */
        .bar-wrapper { display: flex; align-items: flex-end; gap: 4px; height: 100px; border-bottom: 2px solid var(--cyan); padding-bottom: 12px; }
        .seg { flex: 1; background: #111; transition: 0.3s; }
        .seg.on { background: var(--yellow); box-shadow: 0 0 20px var(--yellow); }
        .scale { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 10px 0 40px; color: var(--cyan); }

        /* VÁHA - SKUTOČNÉ SEGMENTY */
        .main { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; height: 220px; }
        #weight-val { 
            font-family: 'Segment', sans-serif; /* Ak sa nenačíta, Teko je záloha */
            font-size: 14rem; color: var(--yellow); text-shadow: 0 0 25px var(--yellow); 
            line-height: 0.8; letter-spacing: 2px;
        }
        .side { width: 220px; font-size: 1rem; color: var(--cyan); }

        /* ODOMETER */
        .odo-box { display: inline-flex; border: 3px solid var(--yellow); padding: 8px; gap: 5px; box-shadow: inset 0 0 15px rgba(244,208,63,0.4); }
        .digit { 
            font-family: 'Segment', sans-serif; font-size: 3rem; color: var(--yellow); 
            min-width: 45px; text-align: center; background: #080808; border: 1px solid rgba(244,208,63,0.3);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div style="text-align:center; letter-spacing:15px; font-size: 1.6rem; margin-bottom:25px;">FILAMENT VÁHA</div>
    
    <div class="bar-wrapper" id="bar"></div>
    <div class="scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span></div>

    <div class="main">
        <div class="side" id="mat-label">---</div>
        <div style="text-align:center;">
            <div id="weight-val">0</div>
            <div style="font-size: 2.5rem; color: var(--yellow); font-weight: 900; margin-top: 10px;">g</div>
        </div>
        <div class="side" style="text-align:right;" id="data-id">---</div>
    </div>

    <div style="text-align:center; margin-top: 30px;">
        <div style="font-size: 0.8rem; letter-spacing: 8px; opacity: 0.7; margin-bottom:15px;">TOTAL LENGTH</div>
        <div class="odo-box" id="odometer"></div>
        <div style="display:inline-block; font-size: 2.5rem; color: var(--yellow); margin-left:15px; vertical-align:middle;">M</div>
    </div>
</div>

<script>
    // 1. SEM DAJ SVOJU NOVÚ URL Z POSLEDNÉHO DEPLOYMENTU
    const SCRIPT_URL = "TVOJA_URL_Z_APPS_SCRIPTU";

    const bar = document.getElementById('bar');
    for(let i=0; i<45; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (30 + (i * 1.6)) + 'px';
        bar.appendChild(s);
    }

    function update() {
        const script = document.createElement('script');
        // Pridáme callback parameter, aby sme obišli CORS
        script.src = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + "action=dashboard&callback=handleData&t=" + Date.now();
        document.body.appendChild(script);
        script.onload = () => script.remove();
    }

    window.handleData = function(data) {
        if (!data.rows || data.rows.length === 0) return;
        const last = data.rows[data.rows.length - 1];

        const vaha = Math.round(parseFloat(last[4].toString().replace(',', '.'))) || 0;
        const len = Math.round(parseFloat(last[5].toString().replace(',', '.'))) || 0;
        const mat = last[2] || "NEZNÁMY";
        const id = last[0] || "---";

        document.getElementById('weight-val').innerText = vaha;
        document.getElementById('mat-label').innerText = mat;
        document.getElementById('data-id').innerText = id;

        const segs = document.querySelectorAll('.seg');
        segs.forEach((s, i) => s.classList.toggle('on', i < (vaha/1000) * 45));

        const odo = document.getElementById('odometer');
        odo.innerHTML = '';
        len.toString().padStart(6, '0').split('').forEach(n => {
            odo.innerHTML += `<div class="digit">${n}</div>`;
        });
    }

    update();
    setInterval(update, 10000);
</script>
</body>
</html>
