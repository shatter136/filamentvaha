<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --cyan: #00f2ff;
            --yellow: #f4d03f;
            --glow-c: 0 0 12px var(--cyan), 0 0 20px rgba(0,242,255,0.6);
            --glow-y: 0 0 15px var(--yellow), 0 0 35px rgba(244,208,63,0.8);
        }

        body { 
            background: var(--bg); 
            color: var(--cyan); 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-transform: uppercase;
        }
        
        .dashboard { 
            width: 700px; 
            padding: 40px; 
            border: 3px solid var(--cyan); 
            box-shadow: var(--glow-c), inset var(--glow-c); 
            background: black;
        }

        /* Progress Bar */
        .bar-section { margin-bottom: 30px; }
        .bar-wrapper { 
            display: flex; 
            align-items: flex-end; 
            gap: 5px; 
            height: 80px; 
            border-bottom: 2px solid var(--cyan); 
            padding-bottom: 10px; 
        }
        .seg { flex: 1; background: #111; transition: 0.4s; }
        .seg.on { background: var(--yellow); box-shadow: var(--glow-y); }
        .scale { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.8rem; font-weight: 900; }

        /* Main Display */
        .main-display { display: flex; justify-content: space-between; align-items: center; margin: 40px 0; }
        
        #weight-val { 
            font-family: 'VT323', monospace; 
            font-size: 13rem; 
            color: var(--yellow); 
            text-shadow: var(--glow-y); 
            line-height: 0.8; 
        }

        .side-label { width: 220px; font-size: 0.95rem; line-height: 1.6; }
        .yellow-text { color: var(--yellow); text-shadow: var(--glow-y); font-weight: 900; }

        /* Odometer */
        .odo-box { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .digit { 
            border: 2px solid var(--yellow); 
            padding: 10px 14px; 
            font-size: 2.8rem; 
            color: var(--yellow); 
            text-shadow: var(--glow-y); 
            background: #080808; 
            box-shadow: inset 0 0 15px rgba(244,208,63,0.2);
        }

        button { 
            display: block; 
            margin: 40px auto 0; 
            background: none; 
            border: 2px solid #ff00ff; 
            color: #ff00ff; 
            padding: 10px 25px; 
            cursor: pointer; 
            text-shadow: 0 0 15px #ff00ff; 
            font-family: inherit;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div style="text-align: center; letter-spacing: 12px; margin-bottom: 25px; font-weight: 900; opacity: 0.8;">FILAMENT STATUS</div>

    <div class="bar-section">
        <div class="bar-wrapper" id="bar"></div>
        <div class="scale">
            <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span>
            <span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span>
        </div>
    </div>

    <div class="main-display">
        <div class="side-label" id="mat-label">NAČÍTAM...</div>
        
        <div style="text-align: center;">
            <div id="weight-val">0</div>
            <div style="font-size: 1.8rem; letter-spacing: 8px; color: var(--cyan); text-shadow: var(--glow-c);">GRAMS</div>
        </div>

        <div class="side-label" style="text-align: right;">
            <div>DLZKA: <span id="data-len" class="yellow-text">0</span> M</div>
            <div class="yellow-text" id="data-id" style="margin-top: 10px;">ID: ---</div>
        </div>
    </div>

    <div style="text-align: center;">
        <div style="font-size: 0.75rem; letter-spacing: 5px; opacity: 0.6;">TOTAL FILAMENT USED</div>
        <div class="odo-box" id="odometer"></div>
    </div>

    <button onclick="updateData()">FORCE REFRESH</button>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwwQmqL7IUlW4JIm7yDZcQ2fDztvYAk5waxXmKJVfJOuIV2VKQzJsHYB2sisQ5-tvkafg/exec";

    // Vygenerovanie 30 segmentov baru
    const bar = document.getElementById('bar');
    for(let i=0; i<30; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (20 + (i * 2)) + 'px';
        bar.appendChild(s);
    }

    async function updateData() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            // JSON dáta sú už spracované, žiadne split(';') netreba!
            const vahaNum = Math.round(data.vaha);
            const lenNum = Math.round(data.dlzka);

            // Aktualizácia textov
            document.getElementById('weight-val').innerText = vahaNum;
            document.getElementById('mat-label').innerText = data.material;
            document.getElementById('data-len').innerText = lenNum;
            document.getElementById('data-id').innerText = "ID: " + data.id;

            // Odometer (6 miest)
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            lenNum.toString().padStart(6, '0').split('').forEach(n => {
                odo.innerHTML += `<div class="digit">${n}</div>`;
            });

            // Progress Bar (predpoklad 1000g cievka)
            const segs = document.querySelectorAll('.seg');
            const ratio = vahaNum / 1000;
            segs.forEach((s, i) => {
                s.classList.toggle('on', i < ratio * 30);
            });

            console.log("Dáta z JSON úspešne načítané.");

        } catch (e) {
            console.error("API Error:", e);
            document.getElementById('mat-label').innerText = "API CONNECTION ERROR";
        }
    }

    updateData();
    setInterval(updateData, 15000); // Refresh každých 15 sekúnd
</script>
</body>
</html>
