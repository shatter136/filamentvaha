<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Michroma&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05060f;
            --cyan: #00f2ff;
            --blue-glow: #007fff;
            --yellow: #f4d03f;
            --yellow-glow: rgba(244, 208, 63, 0.7);
            --neon-shadow-c: 0 0 10px rgba(0, 242, 255, 0.5);
            --neon-shadow-y: 0 0 15px rgba(244, 208, 63, 0.6), 0 0 30px rgba(244, 208, 63, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
            overflow: hidden;
        }

        .dashboard {
            border: 2px solid var(--blue-glow);
            padding: 30px;
            background: linear-gradient(180deg, rgba(0,127,255,0.05) 0%, rgba(0,0,0,0) 100%);
            box-shadow: inset 0 0 20px rgba(0,127,255,0.2), 0 0 40px rgba(0,0,0,1);
            width: 550px;
            position: relative;
        }

        /* Horný Panel - GSI Tachometer s narastajúcim barom */
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--blue-glow);
            padding-bottom: 15px;
        }

        .bar-container {
            display: flex;
            gap: 3px;
            align-items: flex-end;
        }

        .segment {
            width: 12px;
            background-color: #1a1a1a;
            transition: all 0.3s;
        }

        .segment.active {
            background-color: var(--yellow);
            box-shadow: var(--neon-shadow-y);
        }

        .material-info {
            text-align: right;
            font-size: 0.85rem;
            color: var(--yellow);
            text-shadow: var(--neon-shadow-y);
            max-width: 180px;
        }

        /* Stredný Displej - Obrovská Žiariaca Váha */
        .main-display {
            text-align: center;
            margin: 40px 0;
        }

        .weight-value {
            font-family: 'Michroma', sans-serif; /* Použijeme Michroma pre technický segmentový vzhľad */
            font-size: 6rem;
            color: var(--yellow);
            text-shadow: var(--neon-shadow-y);
            font-weight: bold;
            line-height: 1;
        }

        .unit {
            font-size: 1.2rem;
            display: block;
            margin-top: 5px;
            letter-spacing: 5px;
            color: var(--cyan);
        }

        /* Spodná Dáta Mriežka */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--blue-glow);
        }

        .data-item { font-size: 0.75rem; color: var(--cyan); }
        .data-label { color: var(--blue-glow); margin-right: 8px; font-weight: bold; }
        .data-value { color: #fff; }

        /* Odometer štýl pre dĺžku */
        .odometer-box {
            display: inline-block;
            border: 1px solid var(--yellow);
            padding: 3px 8px;
            background: #111;
            color: var(--yellow);
            box-shadow: var(--neon-shadow-y);
            font-size: 0.9rem;
        }

        /* Žiariace tyrkysové a azúrové texty */
        .cyan-glow { text-shadow: 0 0 10px rgba(0,242,255,0.7); color: var(--cyan); }
        .azur-glow { text-shadow: 0 0 10px rgba(0,127,255,0.7); color: #007fff; }
    </style>
</head>
<body>

<div class="dashboard">
    <div style="text-align: center; font-size: 0.9rem; margin-bottom: 15px; letter-spacing: 4px; color: var(--blue-glow);">Filament STATUS</div>
    
    <div class="top-panel">
        <div class="bar-container" id="pixel-bar">
            </div>
        <div class="material-info" id="mat-label">NAČÍTAM...</div>
    </div>

    <div class="main-display">
        <div class="weight-value cyan-glow" id="weight-val">795</div>
        <span class="unit azur-glow">GRAMS</span>
    </div>

    <div class="data-grid">
        <div>
            <div class="data-item"><span class="data-label">HEX:</span><span id="data-hex" class="data-value azur-glow">---</span></div>
            <div class="data-item"><span class="data-label">ID:</span><span id="data-id" class="data-value cyan-glow">---</span></div>
        </div>
        <div style="text-align: right;">
            <div class="data-item azur-glow"><span class="data-label">DLZKA:</span></div>
            <div class="odometer-box cyan-glow"><span id="data-len">0000</span> M</div>
        </div>
    </div>
</div>

<script>
    // TU VLOŽ SVOJ FIXNÝ LINK
    const FIXED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxFZl_JAITJGkdodcTo1ZBF6Do-cjigonJjrTJUDsOG8AWZL9HAmUUWOAd9NkwIBMCYHtOqVTZ9KV7/pub?gid=233832092&single=true&output=csv";

    // Vygenerovanie 20 segmentov s narastajúcou výškou
    const barContainer = document.getElementById('pixel-bar');
    for (let i = 0; i < 20; i++) {
        const seg = document.createElement('div');
        seg.className = 'segment';
        seg.style.height = (10 + (i * 2)) + 'px'; // Každý ďalší je vyšší
        barContainer.appendChild(seg);
    }

    async function updateData() {
        if (!FIXED_CSV_URL || FIXED_CSV_URL.includes("SEM_VLOZ")) {
            document.getElementById('mat-label').innerText = "CHYBA: VLOŽ LINK";
            return;
        }

        try {
            const response = await fetch(FIXED_CSV_URL + "&t=" + new Date().getTime());
            const text = await response.text();
            
            // Rozdelíme riadky a odfiltrujeme prázdne (tu bol problém na GitHube)
            const rows = text.trim().split(/\r?\n/);
            const lastLine = rows[rows.length - 1]; // Berieme posledný riadok

            // DÔLEŽITÉ: Tvoj CSV používa bodkočiarku ako oddeľovač, nie čiarku! (To je ten problém s ID)
            const col = lastLine.split(';').map(c => c.replace(/"/g, '').trim());

            // Mapovanie stĺpcov podľa tvojej tabuľky:
            // col[0]=ID, col[2]=Materiál, col[4]=Váha, col[5]=Dĺžka
            const idVal  = col[0] || "---";
            const matVal = col[2] || "UNKNOWN";
            
            // Konverzia váhy z textu "795,40" na číslo 795.40 (JS nepozná čiarku)
            const vahaRaw = (col[4] || "0").replace(',', '.');
            const vahaNum = parseFloat(vahaRaw) || 0;
            const vahaVal = Math.round(vahaNum);

            // Prepísanie UI
            document.getElementById('weight-val').innerText = vahaVal;
            document.getElementById('mat-label').innerText = matVal;
            document.getElementById('data-hex').innerText = (col[3] || "---").replace(/"/g, '');
            document.getElementById('data-len').innerText = (col[5] || "0000").replace(/"/g, '').padStart(4, '0');
            document.getElementById('data-id').innerText = idVal;

            // Update Baru (Max predpokladáme 1000g)
            const activeSegments = Math.round((vahaVal / 1000) * 20);
            const segments = document.querySelectorAll('.segment');
            segments.forEach((s, i) => {
                s.classList.toggle('active', i < activeSegments);
            });

        } catch (e) {
            console.error(e);
            document.getElementById('mat-label').innerText = "CONNECTION ERROR";
        }
    }

    updateData();
    setInterval(updateData, 15000); // 15s refresh
</script>

</body>
</html>
