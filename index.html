<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Dashboard 80s</title>
    <style>
        :root {
            --bg-color: #050505;
            --neon-cyan: #00f2ff;
            --neon-blue: #0080ff;
            --neon-yellow: #f9d71c;
            --segment-off: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .dashboard {
            border: 4px solid var(--neon-blue);
            padding: 40px;
            box-shadow: 0 0 20px var(--neon-blue);
            background: rgba(0, 0, 0, 0.9);
            text-align: center;
            min-width: 320px;
        }

        .glitch-title {
            font-size: 1rem;
            color: var(--neon-blue);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--neon-blue);
            padding-bottom: 5px;
            letter-spacing: 2px;
        }

        .bar-container {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .segment {
            width: 12px;
            height: 35px;
            background-color: var(--segment-off);
            border: 1px solid #111;
            transition: all 0.3s;
        }

        .segment.on {
            background-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .stats {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            margin: 10px 0;
        }

        #mat-label {
            font-size: 1.2rem;
            color: var(--neon-yellow);
            margin-bottom: 20px;
            display: block;
        }

        .data-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            text-align: left;
            border-top: 1px solid var(--neon-blue);
            padding-top: 15px;
        }

        .data-item { font-size: 0.8rem; }
        .data-label { color: var(--neon-blue); margin-right: 10px; }
        .data-value { color: #fff; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="glitch-title">SMART SPOOL SYSTEM</div>
        
        <div class="bar-container" id="pixel-bar"></div>

        <div class="main-display">
            <div class="stats"><span id="weight-val">0</span>g</div>
            <span id="mat-label">LOADING...</span>
        </div>

        <div class="data-grid">
            <div class="data-item"><span class="data-label">HEX:</span><span id="data-hex" class="data-value">#---</span></div>
            <div class="data-item"><span class="data-label">LENGTH:</span><span id="data-len" class="data-value">---</span> m</div>
            <div class="data-item"><span class="data-label">ID:</span><span id="data-id" class="data-value">---</span></div>
        </div>
    </div>

    <script>
        // SEM VLOŽ SVOJ LINK (ten s gid= a output=csv)
        const csvUrl = 'TU_VLOZ_SVOJ_CSV_LINK'; 

        const barContainer = document.getElementById('pixel-bar');
        const totalSegments = 20;

        for (let i = 0; i < totalSegments; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment';
            barContainer.appendChild(seg);
        }

        async function updateData() {
            try {
                const response = await fetch(csvUrl + "&t=" + new Date().getTime());
                const text = await response.text();
                const allRows = text.trim().split(/\r?\n/);
                
                // Nájdi posledný riadok, kde váha (index 4) nie je "0" alebo prázdna
                let validRows = allRows.filter(row => {
                    const cols = row.split(',');
                    const v = cols[4] ? cols[4].replace(/"/g, '').trim() : "";
                    return v !== "" && v !== "0" && v !== "0,00" && v !== "Váha (g)";
                });

                let lastRowRaw = validRows.length > 0 ? validRows[validRows.length - 1] : allRows[allRows.length - 1];
                const lastRow = lastRowRaw.split(',');

                console.log("Vybrané dáta:", lastRow);

                const vahaRaw = lastRow[4] ? lastRow[4].replace(/"/g, '').replace(',', '.') : "0";
                const vaha = parseFloat(vahaRaw);
                const material = (lastRow[2] || "---").replace(/"/g, '');
                let hex = (lastRow[3] || "00f2ff").replace(/"/g, '').trim();
                if (!hex.startsWith('#')) hex = '#' + hex;

                // Update UI
                document.getElementById('weight-val').innerText = Math.round(vaha);
                document.getElementById('mat-label').innerText = material;
                document.getElementById('data-hex').innerText = hex;
                document.getElementById('data-len').innerText = (lastRow[5] || "---").replace(/"/g, '');
                document.getElementById('data-id').innerText = (lastRow[0] || "---").replace(/"/g, '');

                // Farby
                document.documentElement.style.setProperty('--neon-cyan', hex);
                
                // Bar
                const percent = Math.min(Math.max((vaha / 1000) * 100, 0), 100);
                const activeSegments = Math.round((percent / 100) * totalSegments);
                const segments = document.querySelectorAll('.segment');
                
                segments.forEach((seg, index) => {
                    if (index < activeSegments) {
                        seg.classList.add('on');
                        seg.style.backgroundColor = hex;
                        seg.style.boxShadow = `0 0 10px ${hex}`;
                    } else {
                        seg.classList.remove('on');
                        seg.style.backgroundColor = '';
                        seg.style.boxShadow = '';
                    }
                });
            } catch (e) {
                console.error("Chyba:", e);
            }
        }

        setInterval(updateData, 15000);
        updateData();
    </script>
</body>
</html>
