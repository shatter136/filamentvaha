<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Michroma&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05060f;
            --cyan: #00f2ff;
            --blue-glow: #007fff;
            --yellow: #f4d03f;
            --yellow-glow: rgba(244, 208, 63, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .dashboard {
            width: 600px;
            padding: 40px;
            border: 3px solid var(--blue-glow);
            box-shadow: inset 0 0 20px rgba(0, 127, 255, 0.3), 0 0 40px rgba(0, 0, 0, 1);
            background: black;
            position: relative;
        }

        .title {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 6px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--cyan);
        }

        /* TACHOMETER PANEL */
        .tachometer-container {
            border-bottom: 2px solid var(--blue-glow);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .bar-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 60px;
            margin-bottom: 5px;
        }

        .segment {
            flex: 1;
            background-color: #111;
            transition: 0.3s;
        }

        .segment.on {
            background-color: var(--yellow);
            box-shadow: 0 0 15px var(--yellow-glow);
        }

        .scale {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--cyan);
            padding: 0 2px;
        }

        /* MAIN WEIGHT DISPLAY */
        .main-display {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 40px 0;
        }

        .side-label-left {
            position: absolute;
            left: 0;
            font-size: 0.7rem;
            color: var(--cyan);
        }

        .side-label-right {
            position: absolute;
            right: 0;
            text-align: right;
            font-size: 0.7rem;
        }

        .weight-value {
            font-family: 'Michroma', sans-serif;
            font-size: 8rem;
            color: var(--yellow);
            text-shadow: 0 0 20px var(--yellow-glow);
            line-height: 1;
            letter-spacing: -5px;
        }

        .small-g {
            display: block;
            text-align: center;
            font-size: 1.2rem;
            margin-top: -10px;
            color: var(--cyan);
        }

        /* ODOMETER */
        .total-length-section {
            text-align: center;
            margin-top: 20px;
        }

        .odometer-label {
            font-size: 0.8rem;
            margin-bottom: 8px;
            display: block;
        }

        .odometer-container {
            display: inline-flex;
            border: 2px solid var(--yellow);
            padding: 5px;
            background: #111;
            box-shadow: 0 0 10px var(--yellow-glow);
        }

        .odo-digit {
            font-size: 1.8rem;
            color: var(--yellow);
            padding: 0 5px;
            border-right: 1px solid #333;
        }

        .unit-m {
            font-size: 1.5rem;
            margin-left: 10px;
            align-self: center;
        }

        .btn-refresh {
            display: block;
            margin: 30px auto 0;
            background: none;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 5px 15px;
            font-family: inherit;
            font-size: 0.6rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="title">FILAMENT VÁHA</div>

    <div class="tachometer-container">
        <div class="bar-wrapper" id="bar"></div>
        <div class="scale">
            <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span>
            <span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span>
        </div>
    </div>

    <div class="main-display">
        <div class="side-label-left" id="mat-label">PETG JET BLACK</div>
        
        <div class="weight-box">
            <div class="weight-value" id="weight-val">000</div>
            <div class="small-g">g</div>
        </div>

        <div class="side-label-right">
            <div style="color: var(--cyan)">LENGTH: <span id="data-len-raw">0</span> M</div>
            <div style="color: var(--yellow)" id="data-id">SPOOL-VS</div>
        </div>
    </div>

    <div class="total-length-section">
        <span class="odometer-label">total length</span>
        <div style="display: flex; justify-content: center; align-items: center;">
            <div class="odometer-container" id="odometer">
                </div>
            <span class="unit-m">M</span>
        </div>
    </div>

    <button class="btn-refresh" onclick="updateData()">FORCE REFRESH</button>
</div>

<script>
    const FIXED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxFZl_JAITJGkdodcTo1ZBF6Do-cjigonJjrTJUDsOG8AWZL9HAmUUWOAd9NkwIBMCYHtOqVTZ9KV7/pub?gid=233832092&single=true&output=csv";

    // Inicializácia Baru (25 segmentov pre jemnejší krok)
    const bar = document.getElementById('bar');
    const segCount = 25;
    for (let i = 0; i < segCount; i++) {
        const s = document.createElement('div');
        s.className = 'segment';
        s.style.height = (15 + (i * 1.8)) + 'px';
        bar.appendChild(s);
    }

    async function updateData() {
        if (!FIXED_CSV_URL || FIXED_CSV_URL.includes("SEM_VLOZ")) return;

        try {
            const res = await fetch(FIXED_CSV_URL + "&t=" + new Date().getTime());
            const text = await res.text();
            const rows = text.trim().split(/\r?\n/);
            const valid = rows.filter(r => r.split(',')[4] && r.split(',')[4].replace(/"/g,'').trim() !== "0");
            
            if (valid.length === 0) return;
            const last = valid[valid.length - 1].split(',');

            const vaha = Math.round(parseFloat((last[4] || "0").replace(/"/g, '').replace(',', '.')));
            const material = (last[2] || "---").replace(/"/g, '');
            const len = (last[5] || "0").replace(/"/g, '');
            const id = (last[0] || "---").replace(/"/g, '');

            // Update UI
            document.getElementById('weight-val').innerText = vaha;
            document.getElementById('mat-label').innerText = material;
            document.getElementById('data-len-raw').innerText = len;
            document.getElementById('data-id').innerText = id;

            // Update Odometer
            const odoContainer = document.getElementById('odometer');
            odoContainer.innerHTML = '';
            const paddedLen = len.toString().padStart(6, '0');
            for (char of paddedLen) {
                const d = document.createElement('div');
                d.className = 'odo-digit';
                d.innerText = char;
                odoContainer.appendChild(d);
            }

            // Update Bar (predpoklad max 1000g)
            const activeCount = Math.round((vaha / 1000) * segCount);
            document.querySelectorAll('.segment').forEach((s, i) => {
                s.classList.toggle('on', i < activeCount);
            });

        } catch (e) { console.error(e); }
    }

    setInterval(updateData, 15000);
    updateData();
</script>

</body>
</html>
