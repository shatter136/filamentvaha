<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --c: #00f2ff; --y: #f4d03f; --bg: #000; }
        body { background: var(--bg); color: var(--c); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .dash { width: 800px; padding: 40px; border: 4px solid var(--c); box-shadow: 0 0 40px var(--c); position: relative; background: radial-gradient(circle, #050505 0%, #000 100%); }

        /* GSI BAR */
        .bar { display: flex; align-items: flex-end; gap: 4px; height: 100px; margin-bottom: 5px; }
        .s { flex: 1; background: #111; height: 20px; transition: 0.3s; border-radius: 1px; }
        .s.on { background: var(--y); box-shadow: 0 0 15px var(--y); }
        .scale { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 30px; text-shadow: 0 0 10px var(--c); }

        /* SEGMENTOVÝ DISPLEJ PRE VÁHU */
        .weight-display { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .digit-7 { position: relative; width: 80px; height: 140px; }
        .seg-piece { position: absolute; background: #151515; border-radius: 10px; transition: 0.2s; }
        .seg-piece.active { background: var(--y); box-shadow: 0 0 20px var(--y); }
        
        /* Pozície segmentov (A-G) */
        .a { top: 0; left: 10px; width: 60px; height: 12px; }
        .b { top: 10px; right: 0; width: 12px; height: 55px; }
        .c { bottom: 10px; right: 0; width: 12px; height: 55px; }
        .d { bottom: 0; left: 10px; width: 60px; height: 12px; }
        .e { bottom: 10px; left: 0; width: 12px; height: 55px; }
        .f { top: 10px; left: 0; width: 12px; height: 55px; }
        .g { top: 64px; left: 10px; width: 60px; height: 12px; }

        /* ODOMETER VALČEKY */
        .odo { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .roller { 
            width: 55px; height: 85px; background: linear-gradient(180deg, #000 0%, #222 50%, #000 100%);
            border: 2px solid #333; border-radius: 4px; box-shadow: inset 0 0 15px #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .odo-digit { font-size: 3.5rem; color: var(--y); font-weight: 900; text-shadow: 0 0 10px var(--y); font-family: 'Courier New', monospace; }

        .label { font-size: 0.8rem; letter-spacing: 5px; opacity: 0.7; margin: 10px 0; }
    </style>
    <title>PRUSA3S FILAMENT</title>
</head>
<body>
    <div class="dash">
        <h1 style="letter-spacing: 15px; text-align: center; text-shadow: 0 0 15px var(--c);">FILAMENT VÁHA</h1>
        
        <div class="bar" id="bar"></div>
        <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div id="mat" style="width:200px; font-size: 1.2rem;">ČAKÁM...</div>
            
            <div>
                <div class="weight-display" id="w-disp"></div>
                <div style="color:var(--y); font-size:2rem; font-weight:900; text-align:center; margin-top:10px;">GRAMS</div>
            </div>

            <div id="spool-id" style="width:200px; text-align:right;">ID: ---</div>
        </div>

        <div class="label" style="text-align: center; margin-top: 40px;">TOTAL LENGTH (M)</div>
        <div class="odo" id="odo"></div>
    </div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbz9PItQVdyfDIx9mSs9R-KL_EbfTJRQnsxjlznsjYbqEPcIgOOJMnufR24fx8_wBHMH_g/exec"; // DOPLŇ SVOJU URL!

    // Mapovanie segmentov pre čísla 0-9
    const digitMap = {
        '0': ['a','b','c','d','e','f'],
        '1': ['b','c'],
        '2': ['a','b','g','e','d'],
        '3': ['a','b','g','c','d'],
        '4': ['f','g','b','c'],
        '5': ['a','f','g','c','d'],
        '6': ['a','f','e','d','c','g'],
        '7': ['a','b','c'],
        '8': ['a','b','c','d','e','f','g'],
        '9': ['a','b','c','d','f','g']
    };

    // Vytvor prázdne cifry pre váhu (4 miesta)
    const wDisp = document.getElementById('w-disp');
    for(let i=0; i<4; i++) {
        wDisp.innerHTML += `<div class="digit-7" id="wd-${i}">
            <div class="seg-piece a"></div><div class="seg-piece b"></div>
            <div class="seg-piece c"></div><div class="seg-piece d"></div>
            <div class="seg-piece e"></div><div class="seg-piece f"></div>
            <div class="seg-piece g"></div>
        </div>`;
    }

    // Vytvor bar
    const bar = document.getElementById('bar');
    for(let i=0; i<50; i++) {
        bar.innerHTML += `<div class="s" style="height:${20+(i*1.5)}px"></div>`;
    }

    function refresh() {
        const s = document.createElement('script');
        s.src = `${URL}?action=dashboard&callback=draw&t=${Date.now()}`;
        document.body.appendChild(s);
        s.onload = () => s.remove();
    }

    window.draw = (d) => {
        if(!d.rows || d.rows.length === 0) return;
        const last = d.rows[d.rows.length - 1];
        
        // Extrakcia (uprav indexy podľa tvojho sheetu!)
        const v = Math.round(parseFloat(last[4].toString().replace(',','.'))) || 0;
        const l = Math.round(parseFloat(last[5].toString().replace(',','.'))) || 0;

        document.getElementById('mat').innerText = last[2] || "NEZNÁMY";
        document.getElementById('spool-id').innerText = "ID: " + (last[0] || "---");

        // Update Váha (7-segment)
        const vStr = v.toString().padStart(4, ' ');
        for(let i=0; i<4; i++) {
            const segments = document.querySelectorAll(`#wd-${i} .seg-piece`);
            segments.forEach(s => s.classList.remove('active'));
            if(digitMap[vStr[i]]) {
                digitMap[vStr[i]].forEach(segClass => {
                    document.querySelector(`#wd-${i} .${segClass}`).classList.add('active');
                });
            }
        }

        // Update Bar
        const segs = document.querySelectorAll('.s');
        segs.forEach((el, i) => el.classList.toggle('on', i < (v/1000)*50));

        // Update Odometer
        const odo = document.getElementById('odo');
        odo.innerHTML = "";
        l.toString().padStart(6, '0').split('').forEach(n => {
            odo.innerHTML += `<div class="roller"><div class="odo-digit">${n}</div></div>`;
        });
    };

    refresh();
    setInterval(refresh, 10000);
</script>
</body>
</html>
