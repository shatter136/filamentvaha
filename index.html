<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root { --gsi: #adff2f; --c: #00f2ff; --bg: #000; --glow: 0 0 20px #adff2f, 0 0 40px rgba(173,255,47,0.5); }
        body { background: var(--bg); color: var(--gsi); font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; }
        .dash { width: 800px; padding: 40px; border: 5px solid var(--c); box-shadow: 0 0 40px var(--c); background: #000; position: relative; }
        
        /* GSI BAR */
        .bar { display: flex; align-items: flex-end; gap: 4px; height: 110px; margin-bottom: 5px; border-bottom: 2px solid var(--gsi); }
        .s { flex: 1; background: #111; height: 20px; transition: 0.2s; }
        .s.on { background: var(--gsi); box-shadow: var(--glow); }
        .scale { display: flex; justify-content: space-between; font-size: 14px; font-weight: 900; margin-bottom: 40px; }

        /* VÁHA - FIXNÉ SEGMENTY */
        .w-box { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .digit { position: relative; width: 70px; height: 120px; }
        .seg { position: absolute; background: #151515; border-radius: 5px; transition: 0.1s; }
        .seg.on { background: var(--gsi); box-shadow: var(--glow); }
        
        /* Pozície segmentov */
        .a { top: 0; left: 10px; width: 50px; height: 10px; }
        .b { top: 10px; right: 0; width: 10px; height: 45px; }
        .c { bottom: 10px; right: 0; width: 10px; height: 45px; }
        .d { bottom: 0; left: 10px; width: 50px; height: 10px; }
        .e { bottom: 10px; left: 0; width: 10px; height: 45px; }
        .f { top: 10px; left: 0; width: 10px; height: 45px; }
        .g { top: 55px; left: 10px; width: 50px; height: 10px; }

        /* ODOMETER VALČEKY */
        .odo { display: flex; justify-content: center; gap: 8px; margin-top: 30px; }
        .roll { width: 55px; height: 80px; background: linear-gradient(180deg, #000 0%, #222 50%, #000 100%); border: 2px solid var(--gsi); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 900; box-shadow: inset 0 0 15px #000; position: relative; }
        .roll::after { content: ""; position: absolute; width: 130%; height: 2px; background: var(--gsi); transform: rotate(-45deg); opacity: 0.3; }
    </style>
    <title>PRUSA3S FILAMENT</title>
</head>
<body>
    <div class="dash">
        <h1 style="text-align:center; letter-spacing:15px;">filament váha</h1>
        <div class="bar" id="b"></div>
        <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div>

        <div style="display:flex; justify-content: space-around; align-items: center;">
            <div id="mat" style="width:150px; font-weight:900;">NAČÍTAM...</div>
            <div class="w-box" id="w"></div>
            <div id="sid" style="width:150px; text-align:right;">ID: ---</div>
        </div>

        <p style="text-align:center; margin-top:30px; font-weight:900;">dlzka</p>
        <div class="odo" id="o"></div>
    </div>

<script>
    // SEM DAJ SVOJU URL Z APPS SCRIPTU (DEPLOYMENT)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5I7Jen5luqau6ZMnXxT8weabJqhmrTRBmQCPjwlqE-VGhC62nXOnWWt45sDGgCH3V/exec"; 

    const segMap = {
        '0':['a','b','c','d','e','f'], '1':['b','c'], '2':['a','b','g','e','d'],
        '3':['a','b','g','c','d'], '4':['f','g','b','c'], '5':['a','f','g','c','d'],
        '6':['a','f','e','d','c','g'], '7':['a','b','c'], '8':['a','b','c','d','e','f','g'], '9':['a','b','c','d','f','g'], ' ':[]
    };

    // Inicializácia Baru a Digitov
    const b = document.getElementById('b');
    for(let i=0; i<50; i++) b.innerHTML += `<div class="s" style="height:${20+(i*1.5)}px"></div>`;
    
    const w = document.getElementById('w');
    for(let i=0; i<4; i++) {
        w.innerHTML += `<div class="digit" id="dig-${i}">` + 
            ['a','b','c','d','e','f','g'].map(s => `<div class="seg ${s}"></div>`).join('') + `</div>`;
    }

    function update() {
        const s = document.createElement('script');
        s.src = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + "action=dashboard&callback=processData&t=" + Date.now();
        document.body.appendChild(s);
        s.onload = () => s.remove();
    }

    window.processData = function(data) {
        if(!data.rows || data.rows.length === 0) return;
        const last = data.rows[data.rows.length - 1];
        const v = Math.round(parseFloat(last[4].toString().replace(',','.'))) || 0;
        const l = Math.round(parseFloat(last[5].toString().replace(',','.'))) || 0;

        document.getElementById('mat').innerText = last[2] || "NEZNÁMY";
        document.getElementById('sid').innerText = "ID: " + (last[0] || "---");

        // Váha update
        const vStr = v.toString().padStart(4, ' ');
        for(let i=0; i<4; i++) {
            const segs = document.querySelectorAll(`#dig-${i} .seg`);
            segs.forEach(s => s.classList.remove('on'));
            if(segMap[vStr[i]]) segMap[vStr[i]].forEach(cls => {
                document.querySelector(`#dig-${i} .${cls}`).classList.add('on');
            });
        }

        // Bar a Odometer
        document.querySelectorAll('.s').forEach((el, i) => el.classList.toggle('on', i < (v/1000)*50));
        document.getElementById('o').innerHTML = l.toString().padStart(6, '0').split('').map(n => `<div class="roll">${n}</div>`).join('');
    };

    update();
    setInterval(update, 10000);
</script>
</body>
</html>
