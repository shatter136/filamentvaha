<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05060f;
            --cyan: #00f2ff;
            --blue-glow: #007fff;
            --yellow: #f4d03f;
            /* Brutálne navrstvené žiariace tiene pre Retro/GSI look */
            --glow-c: 0 0 10px rgba(0, 242, 255, 0.7), 0 0 20px rgba(0, 242, 255, 0.4);
            --glow-y: 0 0 15px rgba(244, 208, 63, 0.8), 0 0 35px rgba(244, 208, 63, 0.5);
            --odo-shadow: inset 0 0 15px var(--yellow), 0 0 10px rgba(244, 208, 63, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
            overflow: hidden;
        }

        .dashboard {
            width: 700px;
            padding: 50px;
            border: 4px solid var(--blue-glow);
            box-shadow: 0 0 30px rgba(0, 127, 255, 0.4), inset 0 0 15px rgba(0, 127, 255, 0.2);
            background: radial-gradient(circle, #101018 0%, #000 100%);
            position: relative;
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 12px;
            margin-bottom: 25px;
            text-shadow: var(--glow-c);
        }

        /* GSI TACHOMETER PANEL (HORNÝ BAR) */
        .gsi-bar-section {
            border-bottom: 3px solid var(--cyan);
            padding-bottom: 15px;
            margin-bottom: 40px;
        }

        .bar-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 90px;
            margin-bottom: 10px;
        }

        .segment {
            flex: 1;
            background-color: #1a1a1a;
            transition: all 0.3s ease;
        }

        .segment.on {
            background-color: var(--yellow);
            box-shadow: var(--glow-y);
        }

        .scale {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            text-shadow: var(--glow-c);
        }

        /* HLAVNÝ DIGITÁLNY DISPLEJ (VÁHA) */
        .main-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 50px 0;
        }
        
        #weight-val {
            font-family: 'VT323', monospace; /* Toto vytvorí ten hranatý segmentový look */
            font-size: 13rem;
            color: var(--yellow);
            text-shadow: var(--glow-y);
            line-height: 0.7;
            margin: 0;
        }

        .side-label {
            width: 200px;
            font-size: 1rem;
            line-height: 1.5;
            text-shadow: var(--glow-c);
        }

        .side-label.mat { color: var(--cyan); text-shadow: var(--glow-c); }
        .side-label.odo { text-align: right; color: var(--blue-glow); text-shadow: var(--glow-c); }

        /* ODOMETER (MECHANICKÉ POČÍTADLO METROV) */
        .odo-container {
            text-align: center;
            margin-top: 20px;
        }

        .odo-box {
            display: inline-flex;
            border: 3px solid var(--yellow);
            padding: 8px 12px;
            gap: 6px;
            background: #050505;
            box-shadow: var(--odo-shadow);
            margin-top: 15px;
        }

        .digit {
            font-size: 2.8rem;
            color: var(--yellow);
            text-shadow: var(--glow-y);
            min-width: 30px;
        }

        button {
            display: block;
            margin: 40px auto 0;
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 10px 30px;
            font-family: inherit;
            cursor: pointer;
            text-shadow: 0 0 15px #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="title">FILAMENT VÁHA</div>

    <div class="gsi-bar-section">
        <div class="bar-wrapper" id="bar"></div>
        <div class="scale">
            <span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span>
        </div>
    </div>

    <div class="main-display">
        <div class="side-label mat" id="mat-label">NAČÍTAM...</div>
        
        <div style="text-align: center;">
            <div id="weight-val">795</div>
            <div style="font-size: 2rem; color: var(--cyan); text-shadow: var(--glow-c); letter-spacing: 10px; margin-top: 10px;">G</div>
        </div>

        <div class="side-label odo" style="text-align: right;">
            <div>DLZKA: <span id="data-len">---</span> M</div>
            <div style="color: var(--yellow); text-shadow: var(--glow-y); font-weight: 900; margin-top: 10px;" id="data-id">ID: ---</div>
        </div>
    </div>

    <div class="odo-container">
        <div style="font-size: 0.8rem; letter-spacing: 5px;" class="odo-label">TOTAL FILAMENT USED</div>
        <div class="odo-box" id="odometer"></div>
    </div>

    <button onclick="updateData()">FORCE REFRESH</button>
</div>

<script>
    // TVOJ LINK Z APPS SCRIPTU (upravený, aby prehliadač sťahoval vždy čerstvé dáta)
    const API_URL = "https://script.google.com/macros/s/AKfycbwwQmqL7IUlW4JIm7yDZcQ2fDztvYAk5waxXmKJVfJOuIV2VKQzJsHYB2sisQ5-tvkafg/exec?cachebuster=";

    // Vygenerovanie segmentov tachometra (35 kúskov s narastajúcou výškou)
    const bar = document.getElementById('bar');
    for(let i=0; i<35; i++) {
        let s = document.createElement('div');
        s.className = 'segment';
        s.style.height = (25 + (i * 2)) + 'px'; // Každý segment je vyšší
        bar.appendChild(s);
    }

    async function updateData() {
        if (!API_URL || API_URL.includes("TVOJ_LINK")) return;

        try {
            const res = await fetch(API_URL + "?cachebuster=" + Date.now()); // Vyhnutie sa cache prehliadača
            const data = await res.json();
            
            // Konverzia surových dát (lebo v JSONe sú slovenské formáty s čiarkou)
            const vahaNum = Math.round(parseFloat(data.vaha_raw.toString().replace(',', '.'))) || 0;
            const lenRaw = data.dlzka_raw.toString().replace(',', '.');
            const lenNum = Math.round(parseFloat(lenRaw)) || 0;

            // Aktualizácia textov (presne podla tvojej MK3S tabuľky)
            document.getElementById('weight-val').innerText = vahaNum;
            document.getElementById('mat-label').innerText = data.material;
            document.getElementById('data-len').innerText = lenNum;
            document.getElementById('data-id').innerText = "ID: " + data.id;

            // Odometer (Mechanické počítadlo) - presne 6 miest
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            lenNum.toString().padStart(6, '0').split('').forEach(n => {
                const d = document.createElement('div');
                d.className = 'digit';
                d.innerText = n;
                odo.appendChild(d);
            });

            // GSI Bar Tachometer (predpoklad max cievka 1kg/1000g)
            const segs = document.querySelectorAll('.segment');
            const ratio = vahaNum / 1000;
            segs.forEach((s, i) => {
                s.classList.toggle('on', i < ratio * 35);
            });

        } catch (e) {
            console.error("API Error:", e);
            document.getElementById('mat-label').innerText = "CONNECTION ERROR";
        }
    }

    // Automatický refresh každých 15 sekúnd + prvé spustenie
    setInterval(updateData, 15000);
    updateData();
</script>
</body>
</html>
