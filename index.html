<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <style>
        :root { --c: #00f2ff; --y: #f4d03f; --bg: #000; }
        body { background: var(--bg); color: var(--c); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; text-transform: uppercase; }
        .dash { width: 850px; padding: 40px; border: 4px solid var(--c); box-shadow: 0 0 50px var(--c); background: radial-gradient(circle, #080808 0%, #000 100%); position: relative; }

        /* GSI TACHOMETER BAR */
        .bar { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-bottom: 5px; }
        .s { flex: 1; background: #151515; height: 20px; transition: 0.3s; border-radius: 1px; }
        .s.on { background: var(--y); box-shadow: 0 0 20px var(--y); }
        .scale { display: flex; justify-content: space-between; font-size: 14px; font-weight: 900; margin-bottom: 40px; text-shadow: 0 0 10px var(--c); }

        /* 7-SEGMENTOVÝ DISPLEJ PRE VÁHU */
        .w-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px 0; }
        .digit { position: relative; width: 80px; height: 140px; }
        .seg { position: absolute; background: #111; border-radius: 10px; transition: 0.2s; }
        .seg.active { background: var(--y); box-shadow: 0 0 25px var(--y); }
        
        .sa { top: 0; left: 10px; width: 60px; height: 12px; }
        .sb { top: 10px; right: 0; width: 12px; height: 55px; }
        .sc { bottom: 10px; right: 0; width: 12px; height: 55px; }
        .sd { bottom: 0; left: 10px; width: 60px; height: 12px; }
        .se { bottom: 10px; left: 0; width: 12px; height: 55px; }
        .sf { top: 10px; left: 0; width: 12px; height: 55px; }
        .sg { top: 64px; left: 10px; width: 60px; height: 12px; }

        /* ODOMETER (VALČEKY) */
        .odo { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
        .roller { 
            width: 60px; height: 90px; background: linear-gradient(180deg, #000 0%, #333 50%, #000 100%);
            border: 2px solid #444; border-radius: 5px; box-shadow: inset 0 0 20px #000;
            display: flex; align-items: center; justify-content: center;
        }
        .odo-num { font-size: 4rem; color: var(--y); font-weight: 900; text-shadow: 0 0 15px var(--y); font-family: monospace; }
        
        .label { font-size: 0.9rem; letter-spacing: 8px; opacity: 0.8; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="dash">
        <h1 style="letter-spacing: 20px; text-align: center; margin-bottom: 30px;">filament váha</h1>
        <div class="bar" id="bar"></div>
        <div class="scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div id="mat" style="width:220px; font-size: 1.4rem; font-weight: bold;">---</div>
            <div>
                <div class="w-container" id="w-disp"></div>
                <div style="color:var(--y); font-size:2.5rem; font-weight:900; text-align:center; margin-top:10px;">GRAMS</div>
            </div>
            <div id="sid" style="width:220px; text-align:right; font-size: 1.2rem;">ID: ---</div>
        </div>

        <div class="label">dlzka</div>
        <div class="odo" id="odo"></div>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7jldGmboV7xnIbgsWz9xe9TRmtv2DleYMyGIfSKDAclBW88ZflPEWFMhACx74Ol4zGA/exec";

    const segMap = {
        '0':['sa','sb','sc','sd','se','sf'], '1':['sb','sc'], '2':['sa','sb','sg','se','sd'],
        '3':['sa','sb','sg','sc','sd'], '4':['sf','sg','sb','sc'], '5':['sa','sf','sg','sc','sd'],
        '6':['sa','sf','se','sd','sc','sg'], '7':['sa','sb','sc'], '8':['sa','sb','sc','sd','se','sf','sg'], '9':['sa','sb','sc','sd','sf','sg'], ' ':[]
    };

    // Inicializácia UI
    const bCont = document.getElementById('bar');
    for(let i=0; i<50; i++) bCont.innerHTML += `<div class="s" style="height:${25+(i*1.8)}px"></div>`;

    const wCont = document.getElementById('w-disp');
    for(let i=0; i<4; i++) {
        wCont.innerHTML += `<div class="digit" id="d-${i}">`+
            ['sa','sb','sc','sd','se','sf','sg'].map(s => `<div class="seg ${s}"></div>`).join('') + `</div>`;
    }

    function refresh() {
        const s = document.createElement('script');
        s.src = `${SCRIPT_URL}?action=dashboard&callback=updateUI&t=${Date.now()}`;
        document.body.appendChild(s);
        s.onload = () => s.remove();
    }

    window.updateUI = (data) => {
        if(!data.rows || data.rows.length === 0) return;
        const last = data.rows[data.rows.length - 1];
        
        const v = Math.round(parseFloat(last[4].toString().replace(',','.'))) || 0;
        const l = Math.round(parseFloat(last[5].toString().replace(',','.'))) || 0;

        document.getElementById('mat').innerText = last[2] || "NEZNÁMY";
        document.getElementById('sid').innerText = "ID: " + (last[0] || "---");

        // Váha (7-segment)
        const vStr = v.toString().padStart(4, ' ');
        for(let i=0; i<4; i++) {
            const digs = document.querySelectorAll(`#d-${i} .seg`);
            digs.forEach(d => d.classList.remove('active'));
            if(segMap[vStr[i]]) segMap[vStr[i]].forEach(s => document.querySelector(`#d-${i} .${s}`).classList.add('active'));
        }

        // Bar
        const bars = document.querySelectorAll('.s');
        bars.forEach((el, i) => el.classList.toggle('on', i < (v/1000)*50));

        // Odometer
        const odo = document.getElementById('odo');
        odo.innerHTML = l.toString().padStart(6, '0').split('').map(n => `<div class="roller"><div class="odo-num">${n}</div></div>`).join('');
    };

    refresh();
    setInterval(refresh, 10000);
</script>
</body>
</html>
