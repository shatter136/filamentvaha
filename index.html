<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRUSA3S FILAMENT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-blue: #00d4ff;
            --neon-yellow: #f0f000;
            --neon-red: #ff004c;
            --bg-dark: #020210;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        #dashboard {
    background-color: var(--bg-dark);
    width: 450px;
    height: 380px;
    border: 4px solid var(--neon-blue);
    /* Silnejší tyrkysový glow */
    box-shadow: 0 0 25px rgba(0, 212, 255, 0.5), inset 0 0 15px rgba(0, 212, 255, 0.3);
    padding: 20px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--neon-blue);
    /* Glow pre všetky tyrkysové texty */
    text-shadow: 0 0 10px var(--neon-blue), 0 0 20px rgba(0, 212, 255, 0.5);
    text-transform: uppercase;
}

        .title {
    font-size: 1.1rem;
    margin-bottom: 15px;
    letter-spacing: 4px;
    color: var(--neon-blue);
    /* Vrstvený glow: 
       1. úzka ostrá žiara, 
       2. stredná rozptýlená, 
       3. široká atmosférická žiara */
    text-shadow: 
        0 0 5px var(--neon-blue),
        0 0 10px var(--neon-blue),
        0 0 20px rgba(0, 212, 255, 0.7),
        0 0 40px rgba(0, 212, 255, 0.4);
}

        /* Grafický ukazovateľ (Bar chart) */
       .bar-container {
    display: flex;
    align-items: flex-end;
    /* Toto roztiahne stĺpce presne od kraja po kraj */
    justify-content: space-between; 
    width: 100%; /* Dôležité pre zarovnanie s číslami */
    height: 60px; /* Trošku vyššie ako minule */
    margin-top: 30px;
    margin-bottom: 15px;
}

.bar {
    width: 14px; /* O chlp širšie */
    background: rgba(240, 240, 0, 0.05);
    border: 1px solid rgba(240, 240, 0, 0.1);
}

        .bar.active {
            background: var(--neon-yellow);
            box-shadow: 0 0 8px var(--neon-yellow);
        }

        .scale-labels {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 0.7rem;
    color: var(--neon-blue);
    margin-bottom: 15px;
    padding: 0 2px; /* Jemné doladenie aby čísla sedeli pod stĺpcami */
}

        /* Hlavná váha */
        .weight-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 5.5rem;
    color: var(--neon-yellow);
    text-shadow: 0 0 15px var(--neon-yellow), 0 0 30px rgba(240, 240, 0, 0.6);
    margin: 5px 0;
}

        .unit {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-top: -10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* Celková dĺžka (Odometer look) */
        .odometer-container {
            margin-top: 20px;
            text-align: center;
        }

       .odometer {
    display: flex;
    background: rgba(240, 240, 0, 0.05);
    border: 2px solid var(--neon-yellow);
    padding: 5px;
    gap: 3px;
    box-shadow: 0 0 20px rgba(240, 240, 0, 0.4), inset 0 0 10px rgba(240, 240, 0, 0.2);
}

        .digit {
    background: var(--neon-yellow);
    color: black;
    padding: 5px 8px;
    font-weight: bold;
    font-size: 1.5rem;
    box-shadow: 0 0 5px var(--neon-yellow); /* Glow pre jednotlivé číslice */
}

        /* Ikonky */
        .warning {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--neon-red);
            font-size: 2rem;
            display: none;
            text-shadow: 0 0 10px var(--neon-red);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .blink { animation: blink 1s infinite; }

        .refresh-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--neon-red);
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .refresh-btn:hover { transform: rotate(180deg); }

        .material-label {
    position: absolute;
    left: 20px;
    top: 65%; /* Posun na stred výšky dashboardu */
    transform: translateY(-50%);
    font-size: 0.8rem;
    width: 80px;
    text-align: left;
    line-height: 1.2;
            color: var(--neon-blue);
    /* Vrstvený glow: 
       1. úzka ostrá žiara, 
       2. stredná rozptýlená, 
       3. široká atmosférická žiara */
    text-shadow: 
        0 0 5px var(--neon-blue),
        0 0 10px var(--neon-blue),
        0 0 20px rgba(0, 212, 255, 0.7),
        0 0 40px rgba(0, 212, 255, 0.4);
}
    </style>
</head>
<body>

<div id="dashboard">
    <div class="title">filament-váha</div>
    
    <div class="bar-container" id="bars"></div>
    <div class="scale-labels">
        <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span>
    </div>

    <div class="material-label" id="material-name">PETG JET BLACK</div>

    <div class="weight-display" id="weight-val">0</div>
    <div class="unit">g</div>

    <div class="odometer-container">
        <div style="font-size: 0.7rem; margin-bottom: 5px;">dlzka</div>
        <div class="odometer" id="length-val">
            </div>
    </div>

    <div id="warning-icon" class="warning blink">⚠</div>
    
    <button class="refresh-btn" onclick="fetchData()">🔄</button>
</div>

  

<script>
    // TVOJA URL ADRESA SKRIPTU (nahraď svojou realnou Web App URL)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjdk02orYyJe-XXkFU3Rda1v8_UUbFWk2kn4HmaEb7KzEA_v_hxfCzvYeydayE48Lwjw/exec";

    // Vytvorenie grafických stĺpcov (0-100%)
   // Vygenerovanie nižších paličiek
const barsContainer = document.getElementById('bars');
barsContainer.innerHTML = ''; 
for (let i = 0; i < 20; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    // Začneme na 10px a pridáme 2.5px na každý stĺpec
    bar.style.height = (10 + i * 2.5) + 'px'; 
    barsContainer.appendChild(bar);
}

    function updateDashboard(data) {
        // Váha a materiál
        document.getElementById('weight-val').innerText = Math.round(data.weight);
        document.getElementById('material-name').innerText = data.material;

        // Blikajúci vykričník (< 50g)
        document.getElementById('warning-icon').style.display = data.weight < 50 ? 'block' : 'none';

        // Update stĺpcov (predpokladáme max 1000g pre 100%)
        const percentage = Math.min((data.weight / 1000) * 100, 100);
        const barElements = document.querySelectorAll('.bar');
        const activeCount = Math.floor((percentage / 100) * 20);
        
        barElements.forEach((bar, index) => {
            bar.classList.toggle('active', index < activeCount);
        });

        // Update dĺžky (odometer štýl)
        const lengthStr = Math.round(data.length).toString().padStart(6, '0');
        const odomContainer = document.getElementById('length-val');
        odomContainer.innerHTML = lengthStr.split('').map(d => `<div class="digit">${d}</div>`).join('') + '<span style="color:var(--neon-blue); margin-left:5px; align-self:center">M</span>';
    }

    // JSONP callback funkcia
    function handleData(data) {
        updateDashboard(data);
    }

    function fetchData() {
        // Odstránime starý skript ak existuje
        const oldScript = document.getElementById('api-script');
        if (oldScript) oldScript.remove();

        // Vytvoríme nový skript pre JSONP (obídenie CORS)
        const script = document.createElement('script');
        script.id = 'api-script';
        

        script.src = SCRIPT_URL + "?action=dashboard&callback=handleData&t=" + Date.now();
        
        document.body.appendChild(script);
        console.log("Volám URL:", script.src);
    }
   

    // Automatické načítanie každých 30 sekúnd
    fetchData();
    setInterval(fetchData, 30000);
</script>

</body>
</html>
