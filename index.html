<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Filament Dashboard</title>
    <style>
        body {
            background-color: #050510;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .container {
            width: 500px;
            height: 400px;
            border: 3px solid #0066ff;
            box-shadow: 0 0 20px #0044aa;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            color: #44ffff;
            letter-spacing: 5px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Batéria / Progress bar */
        .progress-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 60px;
            margin-bottom: 5px;
        }
        .segment {
            width: 15px;
            background: #222;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .segment.active {
            background: #ccff00;
            box-shadow: 0 0 10px #ccff00;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            width: 90%;
            font-size: 14px;
            color: #44ffff;
            margin-bottom: 30px;
        }

        /* Hlavná váha - segmentový štýl */
        .weight-display {
            font-size: 100px;
            color: #ffff00;
            text-shadow: 0 0 20px #aaaa00;
            margin: 10px 0;
            font-weight: bold;
        }
        .unit-g { color: #44ffff; font-size: 20px; margin-bottom: 20px; }

        /* Label-y po stranách */
        .label-left { position: absolute; left: 20px; top: 220px; color: #44ffff; font-size: 12px; width: 100px; }
        .label-right { position: absolute; right: 20px; top: 230px; color: #ffff00; font-size: 14px; }

        /* Odometer štýl pre dĺžku */
        .odometer-label { color: #44ffff; font-size: 14px; margin-bottom: 5px; }
        .odometer {
            display: flex;
            border: 2px solid #ffff00;
            background: #222;
            padding: 5px;
            gap: 2px;
        }
        .digit {
            background: #111;
            color: #ffff00;
            padding: 5px 8px;
            border: 1px solid #444;
            font-size: 30px;
            font-weight: bold;
        }
        .unit-m { color: #44ffff; font-size: 20px; margin-left: 10px; align-self: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">FILAMENT VÁHA</div>
    
    <div class="progress-container" id="progressBar">
        </div>
    <div class="scale-labels">
        <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span>
    </div>

    <div class="label-left" id="material">PETG JET BLACK</div>
    
    <div class="weight-display" id="weight">000</div>
    <div class="unit-g">g</div>

    <div class="label-right" id="spoolId">SPOOL-VS</div>

    <div class="odometer-label">total length</div>
    <div style="display: flex;">
        <div class="odometer" id="lengthDigits">
            </div>
        <div class="unit-m">M</div>
    </div>
</div>

<script>
    // SEM VLOŽ SVOJU URL Z APP SKRIPTU (musí končiť na /exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVcE_jdhhRNDJ0p_PYlj1FhH3WUoHOQwAlVWPFaRSX8xhQFLbGkC1x60vbY1-NVpB_pQ/exec";

    function updateDashboard() {
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?action=dashboard&callback=handleData&t=${new Date().getTime()}`;
        document.body.appendChild(script);
        document.body.removeChild(script);
    }

    function handleData(data) {
        if (data.error) return;

        // 1. Váha
        document.getElementById('weight').innerText = Math.round(data.weight);
        document.getElementById('material').innerText = data.material;
        document.getElementById('spoolId').innerText = data.id;

        // 2. Batéria (predpokladáme max 1000g pre 100%)
        const percentage = Math.min((data.weight / 1000) * 100, 100);
        const barContainer = document.getElementById('progressBar');
        barContainer.innerHTML = '';
        for (let i = 0; i < 20; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment';
            seg.style.height = (15 + (i * 2)) + 'px';
            if (i < (percentage / 5)) seg.classList.add('active');
            barContainer.appendChild(seg);
        }

        // 3. Dĺžka (Odometer style)
        const lengthStr = Math.round(data.length).toString().padStart(6, '0');
        const lengthContainer = document.getElementById('lengthDigits');
        lengthContainer.innerHTML = '';
        lengthStr.split('').forEach(num => {
            const div = document.createElement('div');
            div.className = 'digit';
            div.innerText = num;
            lengthContainer.appendChild(div);
        });
    }

    // Spustiť hneď a potom každých 30 sekúnd
    updateDashboard();
    setInterval(updateDashboard, 30000);
</script>

</body>
</html>
