<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Váha Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-blue: #00d4ff;
            --neon-yellow: #f0f000;
            --neon-red: #ff004c;
            --bg-dark: #020210;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        #dashboard {
            background-color: var(--bg-dark);
            width: 450px;
            height: 350px;
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        /* Grafický ukazovateľ (Bar chart) */
        .bar-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 40px;
            margin-bottom: 5px;
        }

        .bar {
            width: 12px;
            background: rgba(240, 240, 0, 0.2);
            box-shadow: 0 0 2px var(--neon-yellow);
        }

        .bar.active {
            background: var(--neon-yellow);
            box-shadow: 0 0 8px var(--neon-yellow);
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.7rem;
            margin-bottom: 20px;
        }

        /* Hlavná váha */
        .weight-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px var(--neon-yellow);
            margin: 10px 0;
        }

        .unit {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-top: -10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* Celková dĺžka (Odometer look) */
        .odometer-container {
            margin-top: 20px;
            text-align: center;
        }

        .odometer {
            display: flex;
            background: rgba(240, 240, 0, 0.1);
            border: 2px solid var(--neon-yellow);
            padding: 5px;
            gap: 2px;
            box-shadow: inset 0 0 10px var(--neon-yellow);
        }

        .digit {
            background: var(--neon-yellow);
            color: black;
            padding: 5px 8px;
            font-weight: bold;
            font-size: 1.5rem;
        }

        /* Ikonky */
        .warning {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--neon-red);
            font-size: 2rem;
            display: none;
            text-shadow: 0 0 10px var(--neon-red);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .blink { animation: blink 1s infinite; }

        .refresh-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--neon-red);
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .refresh-btn:hover { transform: rotate(180deg); }

        .material-label {
            position: absolute;
            left: 20px;
            top: 160px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

<div id="dashboard">
    <div class="title">FILAMENT VÁHA</div>
    
    <div class="bar-container" id="bars"></div>
    <div class="scale-labels">
        <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span>
    </div>

    <div class="material-label" id="material-name">PETG JET BLACK</div>

    <div class="weight-display" id="weight-val">0</div>
    <div class="unit">g</div>

    <div class="odometer-container">
        <div style="font-size: 0.7rem; margin-bottom: 5px;">total length</div>
        <div class="odometer" id="length-val">
            </div>
    </div>

    <div id="warning-icon" class="warning blink">⚠</div>
    
    <button class="refresh-btn" onclick="fetchData()">🔄</button>
</div>

<script>
    // TVOJA URL ADRESA SKRIPTU (nahraď svojou realnou Web App URL)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuZ6p0lp78vsrEnYiXkuctHQpzZNdNxJkTH940r5Su-dIQNJYFVX8HvL-g81PEerjFGA/exec?action=dashboard";

    // Vytvorenie grafických stĺpcov (0-100%)
    const barsContainer = document.getElementById('bars');
    for (let i = 0; i < 20; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = (10 + i * 5) + 'px'; // stupňovanie výšky
        barsContainer.appendChild(bar);
    }

    function updateDashboard(data) {
        // Váha a materiál
        document.getElementById('weight-val').innerText = Math.round(data.weight);
        document.getElementById('material-name').innerText = data.material;

        // Blikajúci vykričník (< 50g)
        document.getElementById('warning-icon').style.display = data.weight < 50 ? 'block' : 'none';

        // Update stĺpcov (predpokladáme max 1000g pre 100%)
        const percentage = Math.min((data.weight / 1000) * 100, 100);
        const barElements = document.querySelectorAll('.bar');
        const activeCount = Math.floor((percentage / 100) * 20);
        
        barElements.forEach((bar, index) => {
            bar.classList.toggle('active', index < activeCount);
        });

        // Update dĺžky (odometer štýl)
        const lengthStr = Math.round(data.length).toString().padStart(6, '0');
        const odomContainer = document.getElementById('length-val');
        odomContainer.innerHTML = lengthStr.split('').map(d => `<div class="digit">${d}</div>`).join('') + '<span style="color:var(--neon-blue); margin-left:5px; align-self:center">M</span>';
    }

    // JSONP callback funkcia
    function handleData(data) {
        updateDashboard(data);
    }

    function fetchData() {
        // Odstránime starý skript ak existuje
        const oldScript = document.getElementById('api-script');
        if (oldScript) oldScript.remove();

        // Vytvoríme nový skript pre JSONP (obídenie CORS)
        const script = document.createElement('script');
        script.id = 'api-script';
        script.src = SCRIPT_URL + "&callback=handleData&t=" + new Date().getTime();
        document.body.appendChild(script);
    }

    // Automatické načítanie každých 30 sekúnd
    fetchData();
    setInterval(fetchData, 30000);
</script>

</body>
</html>
