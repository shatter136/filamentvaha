<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --cyan: #00f2ff; --yellow: #f4d03f; --blue: #007fff; }
        body { background: var(--bg); color: var(--cyan); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; }
        .dashboard { width: 680px; padding: 40px; border: 3px solid var(--blue); box-shadow: 0 0 20px var(--blue); background: #000; }
        .bar-wrapper { display: flex; align-items: flex-end; gap: 4px; height: 80px; border-bottom: 2px solid var(--cyan); padding-bottom: 8px; margin-bottom: 10px; }
        .seg { flex: 1; background: #151515; transition: 0.3s; }
        .seg.on { background: var(--yellow); box-shadow: 0 0 15px var(--yellow); }
        .scale { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 30px; }
        .main { display: flex; justify-content: space-between; align-items: center; margin: 30px 0; }
        #weight-val { font-family: 'VT323', monospace; font-size: 12rem; color: var(--yellow); text-shadow: 0 0 20px var(--yellow); line-height: 0.8; }
        .side { width: 180px; font-size: 0.9rem; }
        .odo { display: flex; justify-content: center; gap: 6px; margin-top: 15px; }
        .digit { border: 2px solid var(--yellow); padding: 8px 12px; font-size: 2.5rem; color: var(--yellow); background: #080808; }
    </style>
</head>
<body>
<div class="dashboard">
    <div style="text-align: center; letter-spacing: 10px; margin-bottom: 20px; color: var(--blue);">FILAMENT VÁHA</div>
    <div class="bar-wrapper" id="bar-container"></div>
    <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div>
    <div class="main">
        <div class="side" id="mat-label">ČAKÁM NA DÁTA...</div>
        <div style="text-align: center;"><div id="weight-val">0</div><div style="letter-spacing: 5px;">GRAMS</div></div>
        <div class="side" style="text-align: right;">
            <div>LENGTH: <span id="data-len" style="color:var(--yellow)">0</span> M</div>
            <div id="data-id" style="color:var(--yellow); margin-top: 10px;">ID: ---</div>
        </div>
    </div>
    <div style="text-align: center; font-size: 0.7rem; opacity: 0.5;">TOTAL USED</div>
    <div class="odo" id="odometer"></div>
</div>
<script>
    // SEM VLOŽ SVOJU NOVÚ URL Z DEPLOYMENTU
    const API_URL = "https://script.google.com/macros/s/AKfycbxnD4cP8EcJrfebLQNubMTdHsJDV1R77OCoVh7iFPlAo17ZOdt1i6NejVdXkBQ9pqTSzA/exec?action=dashboard";

    const barCont = document.getElementById('bar-container');
    for(let i=0; i<35; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (20 + (i * 2)) + 'px';
        barCont.appendChild(s);
    }

    async function updateData() {
        try {
            const res = await fetch(API_URL + "&t=" + Date.now());
            const data = await res.json();
            if (!data.rows) return;
            const lastRow = data.rows[data.rows.length - 1];
            
            const vaha = Math.round(parseFloat(lastRow[4].toString().replace(',', '.'))) || 0;
            const len = Math.round(parseFloat(lastRow[5].toString().replace(',', '.'))) || 0;

            document.getElementById('weight-val').innerText = vaha;
            document.getElementById('mat-label').innerText = lastRow[2];
            document.getElementById('data-len').innerText = len;
            document.getElementById('data-id').innerText = "ID: " + lastRow[0];

            document.querySelectorAll('.seg').forEach((s, i) => s.classList.toggle('on', i < (vaha/1000) * 35));
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            len.toString().padStart(6, '0').split('').forEach(n => {
                odo.innerHTML += `<div class="digit">${n}</div>`;
            });
        } catch (e) { document.getElementById('mat-label').innerText = "API ERROR"; }
    }
    updateData(); setInterval(updateData, 15000);
</script>
</body>
</html>
