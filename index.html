<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>GSI FILAMENT MK3S</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --yellow: #f4d03f; --bg: #000; }
        body { background: var(--bg); color: var(--cyan); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { width: 650px; padding: 30px; border: 2px solid var(--cyan); box-shadow: 0 0 15px var(--cyan); position: relative; }
        
        /* PROGRESS BAR */
        .bar-wrapper { display: flex; align-items: flex-end; gap: 4px; height: 60px; border-bottom: 2px solid var(--cyan); padding-bottom: 5px; margin-bottom: 10px; }
        .seg { flex: 1; background: #222; transition: 0.3s; height: 100%; }
        .seg.on { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
        .scale { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 20px; }

        /* DATA */
        .main { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        #weight-val { font-family: 'VT323', monospace; font-size: 10rem; color: var(--yellow); text-shadow: 0 0 15px var(--yellow); line-height: 0.8; }
        .side { width: 150px; font-size: 0.8rem; }

        /* ODOMETER */
        .odo { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
        .digit { border: 1px solid var(--yellow); padding: 5px 10px; font-size: 2rem; color: var(--yellow); background: #111; }
    </style>
</head>
<body>

<div class="dashboard">
    <div style="text-align:center; font-size: 1.2rem; letter-spacing: 5px; margin-bottom: 15px;">FILAMENT VÁHA</div>
    
    <div class="bar-wrapper" id="bar"></div>
    <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div>

    <div class="main">
        <div class="side" id="mat-label">NAČÍTAM...</div>
        <div style="text-align:center;"><div id="weight-val">0</div><div style="letter-spacing:5px;">GRAMS</div></div>
        <div class="side" style="text-align:right;">
            <div>LEN: <span id="data-len">0</span> M</div>
            <div id="data-id" style="color:var(--yellow); margin-top:5px;">ID: ---</div>
        </div>
    </div>

    <div style="text-align:center; font-size:0.7rem;">TOTAL LENGTH</div>
    <div class="odo" id="odometer"></div>
    
    <button onclick="updateData()" style="display:block; margin: 20px auto; background:none; border: 1px solid #f0f; color:#f0f; cursor:pointer;">REFRESH</button>
</div>

<script>
    // SEM DAJ TVOJU NOVÚ URL Z APPS SCRIPTU
    const API_URL = "https://script.google.com/macros/s/AKfycbwwQmqL7IUlW4JIm7yDZcQ2fDztvYAk5waxXmKJVfJOuIV2VKQzJsHYB2sisQ5-tvkafg/exec";

    // Vytvorenie 30 segmentov pre bar
    const bar = document.getElementById('bar');
    for(let i=0; i<30; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (10 + (i * 1.5)) + 'px';
        bar.appendChild(s);
    }

    async function updateData() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            // Oprava slovenskej čiarky v čísle
            const vaha = Math.round(parseFloat(data.vaha.toString().replace(',', '.'))) || 0;
            const len = Math.round(parseFloat(data.dlzka.toString().replace(',', '.'))) || 0;

            document.getElementById('weight-val').innerText = vaha;
            document.getElementById('mat-label').innerText = data.material;
            document.getElementById('data-len').innerText = len;
            document.getElementById('data-id').innerText = "ID: " + data.id;

            // Update baru (predpoklad max 1000g)
            const segs = document.querySelectorAll('.seg');
            segs.forEach((s, i) => s.classList.toggle('on', i < (vaha/1000) * 30));

            // Odometer
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            len.toString().padStart(6, '0').split('').forEach(n => {
                odo.innerHTML += `<div class="digit">${n}</div>`;
            });

        } catch (e) {
            document.getElementById('mat-label').innerText = "API ERROR - SKONTROLUJ LINK";
            console.error(e);
        }
    }

    updateData();
    setInterval(updateData, 30000);
</script>
</body>
</html>
