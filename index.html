<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --c: #00f2ff; --y: #f4d03f; }
        body { background: #000; color: var(--c); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; }
        .dash { width: 700px; padding: 40px; border: 4px solid var(--c); box-shadow: 0 0 30px var(--c); text-align: center; }
        
        /* Bar a Stupnica */
        .bar { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-bottom: 5px; }
        .s { flex: 1; background: #222; height: 20px; transition: 0.3s; }
        .s.on { background: var(--y); box-shadow: 0 0 15px var(--y); }
        .scale { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 30px; text-shadow: 0 0 10px var(--c); }

        /* Hlavné číslo - Segmenty cez font-stretch */
        #vaha { font-size: 12rem; color: var(--y); text-shadow: 0 0 30px var(--y); font-weight: 900; line-height: 0.8; }
        
        /* ODOMETER - Tie preškrtnuté nuly */
        .odo { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .num { width: 50px; height: 70px; border: 2px solid var(--y); font-size: 3rem; color: var(--y); 
               display: flex; align-items: center; justify-content: center; background: #050505;
               position: relative; overflow: hidden; font-weight: 900; }
        .num::after { content: ""; position: absolute; width: 140%; height: 2px; background: var(--y); transform: rotate(-45deg); opacity: 0.5; }
    </style>
</head>
<body>
    <div class="dash">
        <h2 style="letter-spacing: 10px;">FILAMENT VÁHA</h2>
        <div class="bar" id="b"></div>
        <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div>
        
        <div style="display:flex; justify-content: space-around; align-items: center;">
            <div id="mat" style="width:150px">---</div>
            <div><div id="vaha">0</div><div style="color:var(--y); font-size:1.5rem">GRAMOV</div></div>
            <div id="id" style="width:150px">---</div>
        </div>

        <p style="margin-top:40px; opacity:0.7">DLZKA</p>
        <div class="odo" id="o"></div>
    </div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbx07_EgKMkxB2O7OMO9yZZpd7_6YiDyPdz2fN3giKMhJ5RdJGtuOo9YaXJiAkg5fvROPQ/exec";

    // Generuj bar
    const b = document.getElementById('b');
    for(let i=0; i<50; i++) { b.innerHTML += `<div class="s" style="height:${15+(i*1.2)}px"></div>`; }

    function refresh() {
        const s = document.createElement('script');
        s.src = `${URL}?action=dashboard&callback=draw&t=${Date.now()}`;
        document.body.appendChild(s);
        s.onload = () => s.remove();
    }

    window.draw = (d) => {
        if(!d.rows) return;
        const last = d.rows[d.rows.length - 1];
        const v = Math.round(last[4] || 0);
        const l = Math.round(last[5] || 0);

        document.getElementById('vaha').innerText = v;
        document.getElementById('mat').innerText = last[2] || "NEZNÁMY";
        document.getElementById('id').innerText = "ID: " + (last[0] || "---");

        // Bar update
        const segs = document.querySelectorAll('.s');
        segs.forEach((el, i) => el.className = i < (v/1000)*50 ? 's on' : 's');

        // Odometer (Nuly so škrkancom)
        const o = document.getElementById('o');
        o.innerHTML = "";
        l.toString().padStart(6, '0').split('').forEach(n => {
            o.innerHTML += `<div class="num">${n}</div>`;
        });
    };

    refresh();
    setInterval(refresh, 10000);
</script>
</body>
</html>
