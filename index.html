<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020205;
            --cyan: #00f2ff;
            --yellow: #f4d03f;
            --glow-cyan: 0 0 15px #00f2ff, 0 0 30px rgba(0, 242, 255, 0.5);
            --glow-yellow: 0 0 20px #f4d03f, 0 0 40px rgba(244, 208, 63, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .dashboard {
            width: 650px;
            padding: 50px;
            border: 4px solid var(--cyan);
            box-shadow: 0 0 20px var(--cyan), inset 0 0 20px var(--cyan);
            background: black;
            position: relative;
        }

        .title {
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 8px;
            margin-bottom: 30px;
            text-shadow: var(--glow-cyan);
        }

        /* TACHOMETER S GRADIENTOM */
        .tachometer-container {
            border-bottom: 2px solid var(--cyan);
            padding-bottom: 15px;
            margin-bottom: 40px;
        }

        .bar-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 70px;
        }

        .segment {
            flex: 1;
            background-color: #111;
            transition: 0.3s;
        }

        /* Dynamické žiarenie nastavené cez JS */
        .segment.on {
            box-shadow: var(--glow-yellow);
        }

        .scale {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 8px;
            text-shadow: var(--glow-cyan);
        }

        /* HLAVNÝ SEGMENTOVÝ DISPLEJ (CSS SIMULÁCIA) */
        .main-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0;
        }

        #weight-val {
            font-size: 9rem;
            color: var(--yellow);
            text-shadow: var(--glow-yellow);
            font-weight: 900;
            letter-spacing: -2px;
        }

        .side-info { font-size: 0.8rem; line-height: 2; }
        .yellow-text { color: var(--yellow); text-shadow: var(--glow-yellow); }
        .cyan-text { color: var(--cyan); text-shadow: var(--glow-cyan); }

        /* ODOMETER */
        .odometer-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }

        .odo-digit {
            border: 2px solid var(--yellow);
            padding: 5px 12px;
            font-size: 2rem;
            color: var(--yellow);
            text-shadow: var(--glow-yellow);
            box-shadow: inset 0 0 10px var(--yellow);
            background: #0a0a0a;
        }

        button {
            display: block;
            margin: 40px auto 0;
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            text-shadow: 0 0 10px #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="title">FILAMENT VÁHA</div>

    <div class="tachometer-container">
        <div class="bar-wrapper" id="bar"></div>
        <div class="scale">
            <span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span>
        </div>
    </div>

    <div class="main-display">
        <div class="side-info cyan-text" id="mat-label">LOADING...</div>
        
        <div style="text-align: center;">
            <div id="weight-val">000</div>
            <div class="cyan-text" style="font-size: 1.5rem; margin-top: -10px;">g</div>
        </div>

        <div class="side-info" style="text-align: right;">
            <div class="cyan-text">LENGTH: <span id="data-len">0</span>M</div>
            <div class="yellow-text" id="data-id">---</div>
        </div>
    </div>

    <div style="text-align: center;">
        <div style="font-size: 0.7rem; margin-bottom: 10px;" class="cyan-text">TOTAL LENGTH</div>
        <div class="odometer-container" id="odometer"></div>
    </div>

    <button onclick="updateData()">FORCE REFRESH</button>
</div>

<script>
    const FIXED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxFZl_JAITJGkdodcTo1ZBF6Do-cjigonJjrTJUDsOG8AWZL9HAmUUWOAd9NkwIBMCYHtOqVTZ9KV7/pub?gid=233832092&single=true&output=csv";

    // Vygeneruj segmenty
    const bar = document.getElementById('bar');
    for (let i = 0; i < 30; i++) {
        const s = document.createElement('div');
        s.className = 'segment';
        s.style.height = (15 + (i * 1.8)) + 'px';
        bar.appendChild(s);
    }

    async function updateData() {
        if (!FIXED_CSV_URL || FIXED_CSV_URL.includes("SEM_VLOZ")) return;

        try {
            const res = await fetch(FIXED_CSV_URL + "&t=" + new Date().getTime());
            const text = await res.text();
            const rows = text.trim().split(/\r?\n/);
            const last = rows[rows.length - 1].split(',');

            const vaha = Math.round(parseFloat(last[4].replace(/"/g,'').replace(',','.')));
            const mat = last[2].replace(/"/g,'');
            const len = last[5].replace(/"/g,'');
            const id = last[0].replace(/"/g,'');

            // Update Texty
            document.getElementById('weight-val').innerText = vaha;
            document.getElementById('mat-label').innerText = mat;
            document.getElementById('data-len').innerText = len;
            document.getElementById('data-id').innerText = id;

            // Update Odometer
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            len.toString().padStart(6, '0').split('').forEach(num => {
                const d = document.createElement('div');
                d.className = 'odo-digit';
                d.innerText = num;
                odo.appendChild(d);
            });

            // Update Progress Bar + Glow
            const percent = (vaha / 1000); // predpoklad 1kg
            const segments = document.querySelectorAll('.segment');
            segments.forEach((s, i) => {
                if (i < percent * 30) {
                    s.classList.add('on');
                    // Miešanie farieb: čím viac vpravo, tým viac do žlta/tyrkysova
                    const ratio = i / 30;
                    s.style.backgroundColor = `rgb(${244 * ratio}, ${240}, ${255 * (1-ratio)})`;
                    s.style.boxShadow = `0 0 20px rgba(0, 242, 255, ${0.5 + ratio})`;
                } else {
                    s.classList.remove('on');
                    s.style.backgroundColor = '#111';
                    s.style.boxShadow = 'none';
                }
            });

        } catch (e) { console.error(e); }
    }

    setInterval(updateData, 15000);
    updateData();
</script>
</body>
</html>
