<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Prusa3s FILAMENT</title>
    <style>
        body { background-color: #010105; color: #00ffff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; overflow: hidden; }
        .container { width: 600px; height: 450px; border: 4px solid #1a75ff; box-shadow: 0 0 30px #0044cc, inset 0 0 20px #002266; position: relative; background: #010108; display: flex; flex-direction: column; align-items: center; }
        .header { color: #44ffff; letter-spacing: 6px; font-weight: bold; margin-top: 25px; font-size: 22px; text-shadow: 0 0 15px #00ffff; }
        .bar-wrap { display: flex; align-items: flex-end; gap: 5px; margin-top: 25px; height: 80px; }
        .seg { width: 18px; background: #111; border: 1px solid #222; }
        .seg.on { background: #d4ff00; box-shadow: 0 0 15px #d4ff00, 0 0 30px #88aa00; border-color: #fff; }
        .scale-labels { display: flex; justify-content: space-between; width: 85%; font-size: 14px; color: #44ffff; margin-top: 8px; text-shadow: 0 0 5px #00ffff; }
        .weight-box { display: flex; gap: 10px; margin-top: 25px; min-height: 110px; }
        .digit-svg { width: 65px; height: 110px; fill: #111; }
        .digit-svg path.on { fill: #ffff00; filter: drop-shadow(0 0 10px #ffff00) drop-shadow(0 0 20px #ffaa00); }
        .unit-g { color: #44ffff; font-size: 24px; margin-top: 5px; text-shadow: 0 0 12px #00ffff; }
        .label-left { position: absolute; top: 250px; left: 35px; font-size: 14px; color: #40ffff; text-shadow: 0 0 8px #40ffff; width: 140px; }
        .label-right { position: absolute; top: 260px; right: 35px; color: #ffff00; font-size: 18px; text-shadow: 0 0 15px #ffff00; font-weight: bold; }
        .odo-label { margin-top: 25px; font-size: 14px; color: #44ffff; text-shadow: 0 0 5px #00ffff; }
        .odo-box { border: 2px solid #ffff00; padding: 5px; display: flex; gap: 4px; background: #000; box-shadow: 0 0 20px rgba(255,255,0,0.3); }
        .odo-digit { width: 38px; height: 55px; background: #0a0a0a; border: 1px solid #333; color: #ffff00; font-size: 40px; text-align: center; font-weight: bold; line-height: 55px; text-shadow: 0 0 12px #ffff00; }
        .warning-icon { position: absolute; bottom: 45px; left: 55px; font-size: 80px; color: #ff0000; display: none; text-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000; animation: blink 0.7s infinite; z-index: 100; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .refresh-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 8px 15px;
    background: transparent;
    border: 2px solid #00f3ff;
    color: #00f3ff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 5px;
    box-shadow: 0 0 5px #00f3ff, inset 0 0 5px #00f3ff;
    transition: all 0.3s ease;
    z-index: 1000;
}

.refresh-btn:hover {
    background: #00f3ff;
    color: #000;
    box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
    text-shadow: none;
}

.refresh-btn:active {
    transform: scale(0.95);
}
    </style>
</head>
<body>
    <button class="refresh-btn" onclick="refreshData()">Sync Data</button>
    <div class="warning-icon" id="alert">!</div>
    <div class="container">
        <div class="header">FILAMENT VÁHA</div>
        <div class="bar-wrap" id="bar"></div>
        <div class="scale-labels"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span></div>
        <div class="label-left" id="material">---</div>
        <div class="weight-box" id="weight"></div>
        <div class="unit-g">G</div>
        <div class="label-right" id="spoolId">---</div>
        <div class="odo-label">dlzka</div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="odo-box" id="odo"></div>
            <div style="color: #1a75ff; font-size: 28px; font-weight: bold; text-shadow: 0 0 15px #1a75ff;">M</div>
        </div>
    </div>

   <script>
    // Táto funkcia spracuje dáta, ktoré vráti App Script (JSONP)
    function handleData(data) {
        console.log("Prijaté dáta:", data);
        
        // Aktualizácia hodnôt na stránke (používam ID z tvojho pôvodného webu)
        // Ak máš v HTML iné ID, len ich tu prepíš
        if (document.getElementById('weight-value')) {
            document.getElementById('weight-value').innerText = data.weight;
        }
        if (document.getElementById('length-value')) {
            document.getElementById('length-value').innerText = data.length;
        }
        if (document.getElementById('material-name')) {
            document.getElementById('material-name').innerText = data.material;
        }
        if (document.getElementById('filament-id')) {
            document.getElementById('filament-id').innerText = data.id;
        }
        
        // Odstránime "loading" efekt, ak by si nejaký mal
        console.log("Dashboard aktualizovaný.");
    }

    // Hlavná funkcia na načítanie dát
    function refreshData() {
        console.log("Ťahám nové dáta...");
        
        // TVOJA URL - doplň si tam tú svoju reálnu adresu!
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxY4lXaenvrMR-tJpkcNIWyZRENHQLacS0Q_FBFBNNY81wF-W_Z1ThQBiqui11qislCSA/exec"; 
        
        // Musíme pridať ?action=dashboard, aby tvoj App Script prešiel cez IF podmienku
        const fullUrl = scriptUrl + "?action=dashboard&callback=handleData&t=" + new Date().getTime();
        
        // Vytvoríme script element (JSONP princíp)
        const oldScript = document.getElementById('jsonp-script');
        if (oldScript) oldScript.remove(); // Vymažeme starý pokus, ak tam bol

        const script = document.createElement('script');
        script.id = 'jsonp-script';
        script.src = fullUrl;
        
        // Po načítaní ho upraceme
        script.onload = () => script.remove();
        
        document.body.appendChild(script);
    }

    // Automatické načítanie pri otvorení stránky
    window.onload = refreshData;
    
    // Bonus: Automatický refresh každých 5 minút (300 000 ms)
    setInterval(refreshData, 300000);
</script>
</body>
</html>
