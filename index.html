<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --cyan: #00f2ff;
            --yellow: #f4d03f;
            --glow-c: 0 0 10px var(--cyan), 0 0 20px rgba(0,242,255,0.8);
            --glow-y: 0 0 15px var(--yellow), 0 0 35px rgba(244,208,63,0.9);
        }

        body { 
            background: var(--bg); 
            color: var(--cyan); 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .dashboard { 
            width: 750px; 
            padding: 40px; 
            border: 4px solid var(--cyan); 
            box-shadow: var(--glow-c), inset var(--glow-c); 
            background: #000;
        }

        .title { 
            text-align: center; 
            font-size: 1.5rem; 
            letter-spacing: 10px; 
            margin-bottom: 20px; 
            text-shadow: var(--glow-c); 
        }

        /* PROGRESS BAR AREA */
        .bar-section { margin-bottom: 40px; }
        .bar-wrapper { 
            display: flex; 
            align-items: flex-end; 
            gap: 4px; 
            height: 80px; 
            border-bottom: 2px solid var(--cyan);
            padding-bottom: 10px;
        }
        .seg { flex: 1; background: #111; transition: 0.2s; }
        .seg.on { background: var(--yellow); box-shadow: var(--glow-y); }
        
        .scale { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 10px; 
            font-size: 0.9rem; 
            text-shadow: var(--glow-c);
            font-weight: 900;
        }

        /* MAIN DISPLAY */
        .main-display { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 40px 0; 
        }
        
        #weight-val { 
            font-family: 'VT323', monospace; 
            font-size: 12rem; 
            color: var(--yellow); 
            text-shadow: var(--glow-y); 
            line-height: 0.8;
        }

        .side-info { width: 220px; font-size: 1rem; line-height: 1.6; }
        .yellow-glow { color: var(--yellow); text-shadow: var(--glow-y); font-weight: 900; }

        /* ODOMETER */
        .odo-container { text-align: center; margin-top: 20px; }
        .odo-box { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            margin-top: 10px; 
        }
        .digit { 
            border: 3px solid var(--yellow); 
            padding: 8px 14px; 
            font-size: 2.8rem; 
            color: var(--yellow); 
            text-shadow: var(--glow-y); 
            box-shadow: inset 0 0 15px var(--yellow);
            background: #050505;
        }

        button { 
            display: block; 
            margin: 30px auto 0; 
            background: none; 
            border: 2px solid #ff00ff; 
            color: #ff00ff; 
            padding: 10px 25px; 
            cursor: pointer; 
            text-shadow: 0 0 10px #ff00ff; 
            font-family: inherit;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="title">FILAMENT VÁHA</div>

    <div class="bar-section">
        <div class="bar-wrapper" id="bar"></div>
        <div class="scale">
            <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span>
            <span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span>
        </div>
    </div>

    <div class="main-display">
        <div class="side-info" id="mat-label">NAČÍTAM...</div>
        
        <div style="text-align: center;">
            <div id="weight-val">---</div>
            <div style="font-size: 1.8rem; color: var(--cyan); text-shadow: var(--glow-c); margin-top: 5px;">GRAMS</div>
        </div>

        <div class="side-info" style="text-align: right;">
            <div>LENGTH: <span id="data-len">0</span> M</div>
            <div class="yellow-glow" id="data-id" style="margin-top: 10px;">ID: ---</div>
        </div>
    </div>

    <div class="odo-container">
        <div style="font-size: 0.8rem; letter-spacing: 5px; opacity: 0.8;">TOTAL FILAMENT USED</div>
        <div class="odo-box" id="odometer"></div>
    </div>

    <button onclick="updateData()">FORCE REFRESH</button>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxFZl_JAITJGkdodcTo1ZBF6Do-cjigonJjrTJUDsOG8AWZL9HAmUUWOAd9NkwIBMCYHtOqVTZ9KV7/pub?gid=233832092&single=true&output=csv";

    // Generovanie baru
    const bar = document.getElementById('bar');
    for(let i=0; i<40; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (20 + (i * 1.5)) + 'px';
        bar.appendChild(s);
    }

    async function updateData() {
        try {
            const res = await fetch(CSV_URL + "&t=" + Date.now());
            const text = await res.text();
            const rows = text.trim().split(/\r?\n/);
            
            // DÔLEŽITÉ: Tvoj CSV používa bodkočiarku ako oddeľovač!
            const lastRow = rows[rows.length - 1];
            const col = lastRow.split(';').map(c => c.replace(/"/g, '').trim());

            // Mapovanie stĺpcov z tvojho linku:
            // A(0)=ID, C(2)=Mat, E(4)=Váha, F(5)=Dĺžka
            const idVal = col[0] || "---";
            const matVal = col[2] || "NEZNÁMY";
            
            // Oprava slovenskej čiarky na bodku pre výpočty
            const vahaRaw = (col[4] || "0").replace(',', '.');
            const lenRaw = (col[5] || "0").replace(',', '.');

            const vahaNum = Math.round(parseFloat(vahaRaw)) || 0;
            const lenNum = Math.round(parseFloat(lenRaw)) || 0;

            // UI Update
            document.getElementById('weight-val').innerText = vahaNum;
            document.getElementById('mat-label').innerText = matVal;
            document.getElementById('data-len').innerText = lenNum;
            document.getElementById('data-id').innerText = "ID: " + idVal;

            // Odometer (6 miest)
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            lenNum.toString().padStart(6, '0').split('').forEach(n => {
                odo.innerHTML += `<div class="digit">${n}</div>`;
            });

            // Progress Bar (Predpoklad max 1000g)
            const segs = document.querySelectorAll('.seg');
            const ratio = vahaNum / 1000;
            segs.forEach((s, i) => {
                s.classList.toggle('on', i < ratio * 40);
            });

            console.log("Dáta prijaté:", {vahaNum, matVal});

        } catch (e) {
            console.error("Chyba:", e);
            document.getElementById('mat-label').innerText = "CHYBA PREPOJENIA";
        }
    }

    updateData();
    setInterval(updateData, 10000);
</script>
</body>
</html>
