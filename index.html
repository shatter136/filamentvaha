<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Brutálne sýta Žlto-Zelená farba */
            --gsi: #ccff00; 
            --c: #00f2ff;
            --bg: #000;
            /* Masívna žiara */
            --glow: 0 0 15px rgba(204,255,0,0.8), 0 0 30px rgba(204,255,0,0.5);
        }

        body { background: var(--bg); color: var(--gsi); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; overflow: hidden; }
        
        .dashboard { width: 750px; padding: 45px; border: 4px solid var(--c); box-shadow: 0 0 30px var(--c); background: radial-gradient(circle, #080808 0%, #000 100%); }

        /* GSI BAR TACHOMETER */
        .bar-section { margin-bottom: 30px; }
        .bar-wrapper { display: flex; align-items: flex-end; gap: 4px; height: 100px; border-bottom: 2px solid var(--gsi); padding-bottom: 10px; box-shadow: 0 5px 15px -5px var(--gsi); }
        .seg { flex: 1; background: #1a1a1a; transition: 0.3s; }
        .seg.on { background: var(--gsi); box-shadow: var(--glow); }
        .scale { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 10px 0 30px 0; text-shadow: var(--glow); font-weight: 700; }

        /* VÁHA - SEGMENTOVÉ ČÍSLA */
        .main-display { display: flex; justify-content: space-between; align-items: center; margin: 40px 0; height: 180px; }
        #weight-val { font-size: 15rem; color: var(--gsi); text-shadow: var(--glow); line-height: 0.7; letter-spacing: -2px; }
        .side-info { width: 200px; font-size: 1.1rem; line-height: 1.5; color: var(--gsi); text-shadow: var(--glow); }

        /* ODOMETER - VALČEKOVÉ POČÍTADLO KM */
        .odo-container { text-align: center; margin-top: 30px; }
        .odo-box { display: inline-flex; border: 3px solid var(--gsi); padding: 8px; gap: 6px; background: #000; box-shadow: inset 0 0 15px rgba(204,255,0,0.3); }
        .digit { 
            font-size: 3.5rem; color: var(--gsi); text-shadow: var(--glow); 
            min-width: 45px; text-align: center; border: 1px solid rgba(204,255,0,0.2);
            /* Valčekový efekt gradientom */
            background: linear-gradient(180deg, #111 0%, #000 50%, #111 100%);
        }
        /* Preškrtnuté nuly pre odometer */
        .zero-strike::after {
            content: ""; position: absolute; left: 50%; top: 50%; width: 140%; height: 2px;
            background: var(--gsi); opacity: 0.6; transform: translate(-50%, -50%) rotate(-45deg);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div style="text-align:center; letter-spacing:15px; font-size: 1.6rem; margin-bottom:25px; text-shadow: var(--glow);">filament váha</div>
    
    <div class="bar-section">
        <div class="bar-wrapper" id="bar"></div>
        <div class="scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span></div>
    </div>

    <div class="main-display">
        <div class="side-info" id="mat-label">NAČÍTAM...</div>
        <div style="text-align:center;">
            <div id="weight-val">0</div>
            <div style="font-size: 2.5rem; color: var(--gsi); text-shadow: var(--glow);">g</div>
        </div>
        <div class="side-info" style="text-align:right;" id="data-id">---</div>
    </div>

    <div class="odo-container">
        <div style="font-size: 0.8rem; letter-spacing: 5px; opacity: 0.7; margin-bottom:15px;">dlzka</div>
        <div class="odo-box" id="odometer"></div>
        <div style="display:inline-block; font-size: 2.5rem; color: var(--gsi); text-shadow: var(--glow); margin-left:15px; vertical-align:middle;">M</div>
    </div>
</div>

<script>
    // 1. SEM DAJ SVOJU NOVÚ URL Z POSLEDNÉHO DEPLOYMENTU
    const BASE_URL = "https://script.google.com/macros/s/AKfycbwwQmqL7IUlW4JIm7yDZcQ2fDztvYAk5waxXmKJVfJOuIV2VKQzJsHYB2sisQ5-tvkafg/exec?action=dashboard";

    // Vygenerovanie dielikov baru tachometra
    const bar = document.getElementById('bar');
    for(let i=0; i<45; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (25 + (i * 1.8)) + 'px'; // Narastajúca výška dielikov
        bar.appendChild(s);
    }

    // 2. TÁTO FUNKCIA ROBÍ JSONP A OBCHÁDZA CORS
    function fetchData() {
        const script = document.createElement('script');
        script.src = `${BASE_URL}&callback=processData&t=${Date.now()}`;
        document.body.appendChild(script);
        script.onload = () => script.remove(); // Vyčistíme script tag po použití
    }

    // 3. TÁTO FUNKCIA SPRACOVÁVA DÁTA
    window.processData = function(data) {
        if (!data.rows || data.rows.length === 0) return;
        const last = data.rows[data.rows.length - 1]; // Zoberieme posledný riadok

        // Konverzia slovenských čísel na JavaScript bodku
        const vahaRaw = last[4] ? last[4].toString().replace(',', '.') : "0";
        const lenRaw = last[5] ? last[5].toString().replace(',', '.') : "0";

        const vaha = Math.round(parseFloat(vahaRaw)) || 0;
        const len = Math.round(parseFloat(lenRaw)) || 0;
        const mat = last[2] || "NEZNÁMY";
        const id = last[0] || "---";

        // Update UI
        document.getElementById('weight-val').innerText = vaha;
        document.getElementById('mat-label').innerText = mat;
        document.getElementById('data-id').innerText = "ID: " + id;

        // Update Baru (predpoklad 1000g cievka)
        const segs = document.querySelectorAll('.seg');
        const activeCount = Math.floor((vaha / 1000) * 45);
        segs.forEach((s, i) => s.classList.toggle('on', i < activeCount));

        // Update Odometra (valčekový efekt)
        const odo = document.getElementById('odometer');
        odo.innerHTML = '';
        len.toString().padStart(6, '0').split('').forEach(n => {
            const digit = document.createElement('div');
            digit.className = 'digit';
            digit.innerText = n;
            if(n === "0") digit.classList.add('zero-strike'); // Preškrtnuté nuly
            odo.appendChild(digit);
        });
    }

    // Spustíme prvýkrát a potom každých 15 sekúnd
    fetchData();
    setInterval(fetchData, 15000);
</script>
</body>
</html>
