<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>GSI FILAMENT DASHBOARD FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Definícia segmentového fontu pre váhu (GSI look) */
        @font-face {
            font-family: 'Segment';
            src: url('https://db.onlinewebfonts.com/t/788933667104a37f02f0a1c137456d2a.woff2') format('woff2');
        }
        :root { --bg: #000; --cyan: #00f2ff; --yellow: #f4d03f; --odo-shadow: inset 0 0 10px rgba(244,208,63,0.3); }
        body { background: var(--bg); color: var(--cyan); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; overflow: hidden; }
        .dashboard { width: 750px; padding: 45px; border: 4px solid var(--cyan); box-shadow: 0 0 40px var(--cyan); background: #000; position: relative; }
        
        /* HORNÝ GSI BAR */
        .bar-wrapper { display: flex; align-items: flex-end; gap: 4px; height: 100px; padding-bottom: 8px; margin-bottom: 0; }
        .seg { flex: 1; background: #111; transition: 0.3s; }
        .seg.on { background: var(--yellow); box-shadow: 0 0 20px var(--yellow); }
        .scale { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 5px 0 40px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); font-weight: 700; }

        /* VÁHA - HLAVNÝ SEGMENTOVÝ LOOK */
        .main { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; height: 220px; }
        #weight-val { 
            font-family: 'Segment', sans-serif; /* Ak nenačíta, Orbitron je záloha */
            font-size: 14rem; color: var(--yellow); text-shadow: 0 0 25px var(--yellow); 
            line-height: 0.8; letter-spacing: 2px;
        }
        .side { width: 220px; font-size: 1rem; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

        /* ODOMETER - POČÍTADLO KM */
        .odo-container { text-align: center; margin-top: 20px; }
        .odo-box { display: inline-flex; border: 3px solid var(--yellow); padding: 6px; gap: 6px; background: #050505; box-shadow: var(--odo-shadow); }
        .digit { 
            font-family: 'Orbitron', sans-serif; /* Používame Orbitron pre metre, font mal chybu */
            font-size: 3.2rem; font-weight: 900; color: var(--yellow); 
            text-shadow: 0 0 15px var(--yellow); min-width: 45px; text-align: center; border: 1px solid rgba(244,208,63,0.3);
            letter-spacing: -2px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div style="text-align:center; letter-spacing:15px; font-size: 1.6rem; margin-bottom:25px; text-shadow: 0 0 10px var(--cyan);">FILAMENT VÁHA</div>
    <div class="bar-wrapper" id="bar"></div>
    <div class="scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span></div>
    <div class="main">
        <div class="side" id="mat-label">ČAKÁM...</div>
        <div style="text-align:center;">
            <div id="weight-val">0</div>
            <div style="font-size: 2.5rem; color: var(--yellow); font-weight: 900; margin-top: 10px; text-shadow: 0 0 15px var(--yellow);">g</div>
        </div>
        <div class="side" style="text-align:right;" id="data-id">---</div>
    </div>
    <div class="odo-container">
        <div style="font-size: 0.8rem; letter-spacing: 6px; opacity: 0.7; margin-bottom:15px; color: var(--cyan);">TOTAL LENGTH</div>
        <div class="odo-box" id="odometer"></div>
        <div style="display:inline-block; font-size: 2.5rem; color: var(--yellow); margin-left:15px; vertical-align:middle; text-shadow: 0 0 15px var(--yellow);">M</div>
    </div>
</div>
<script>
    // SEM DAJ SVOJU NOVÚ URL Z POSLEDNÉHO DEPLOYMENTU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxb0ImdJCVgxfPCQpxNh2T0wNRIDQbZNxpiZVOmtMDaYiy2KIlV8lzDrB6xkiO4n1Jzzw/exec";

    // Vygenerovanie dielikov baru (45 kúskov s narastajúcou výškou)
    const barCont = document.getElementById('bar');
    for(let i=0; i<45; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (30 + (i * 1.6)) + 'px';
        barCont.appendChild(s);
    }

    // Inicializácia odometra s nulami (aby tam nebolo prázdno, kým sa načítajú dáta)
    updateOdometer("0");

    function update() {
        const script = document.createElement('script');
        script.src = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + "action=dashboard&callback=handleData&t=" + Date.now();
        document.body.appendChild(script);
        script.onload = () => script.remove();
    }

    // Táto funkcia prijíma a spracováva dáta (JSONP)
    window.handleData = function(data) {
        if (!data.rows || data.rows.length === 0) return;
        const last = data.rows[data.rows.length - 1]; // Berieme posledný riadok

        // Konverzia slovenských čísel na JavaScript čísla
        const vaha = Math.round(parseFloat(last[4].toString().replace(',', '.'))) || 0;
        const len = Math.round(parseFloat(last[5].toString().replace(',', '.'))) || 0;
        const id = last[0] ? last[0].toString() : "---";

        // Update UI
        document.getElementById('weight-val').innerText = vaha;
        document.getElementById('mat-label').innerText = last[2] || "UNKNOWN";
        document.getElementById('data-id').innerText = id;

        // Tachometer Update (predpoklad max 1000g cievka)
        const segs = document.querySelectorAll('.seg');
        const ratio = vaha / 1000;
        segs.forEach((s, i) => s.classList.toggle('on', i < ratio * 45));

        // Odometer Update
        updateOdometer(len);
    }

    // Pomocná funkcia na vykreslenie odometra
    function updateOdometer(lenValue) {
        const odo = document.getElementById('odometer');
        odo.innerHTML = '';
        lenValue.toString().padStart(6, '0').split('').forEach(n => {
            const d = document.createElement('div');
            d.className = 'digit';
            d.innerText = n;
            odo.appendChild(d);
        });
    }

    // Automatický refresh každých 15 sekúnd + prvé spustenie
    update();
    setInterval(update, 15000);
</script>
</body>
</html>
