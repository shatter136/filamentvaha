<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>PRUSA3S FILAMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05060f; --cyan: #00f2ff; --yellow: #f4d03f;
            --glow-c: 0 0 10px var(--cyan); --glow-y: 0 0 20px var(--yellow);
        }
        body { background: var(--bg); color: var(--cyan); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-transform: uppercase; }
        .dashboard { width: 720px; padding: 40px; border: 4px solid var(--cyan); box-shadow: 0 0 25px var(--cyan); background: #000; }
        
        /* GSI BAR */
        .bar-wrapper { display: flex; align-items: flex-end; gap: 4px; height: 90px; border-bottom: 3px solid var(--cyan); padding-bottom: 10px; margin-bottom: 5px; }
        .seg { flex: 1; background: #111; transition: 0.2s; }
        .seg.on { background: var(--yellow); box-shadow: var(--glow-y); }
        .scale { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 30px; letter-spacing: 2px; }

        /* VÁHA - SEGMENT LOOK */
        .main { display: flex; justify-content: space-between; align-items: center; margin: 40px 0; }
        #weight-val { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 13rem; color: var(--yellow); text-shadow: var(--glow-y); 
            line-height: 0.8; letter-spacing: -5px;
        }
        .side { width: 200px; font-size: 0.9rem; line-height: 1.4; }

        /* ODOMETER */
        .odo-box { display: inline-flex; border: 3px solid var(--yellow); padding: 10px; gap: 5px; background: #050505; box-shadow: inset 0 0 10px var(--yellow); }
        .digit { font-size: 2.5rem; color: var(--yellow); text-shadow: var(--glow-y); min-width: 32px; text-align: center; border-right: 1px solid rgba(244,208,63,0.2); }
    </style>
</head>
<body>
<div class="dashboard">
    <div style="text-align:center; letter-spacing:10px; margin-bottom:20px;">FILAMENT VÁHA</div>
    <div class="bar-wrapper" id="bar"></div>
    <div class="scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90</span><span>100</span></div>
    
    <div class="main">
        <div class="side" id="mat-label">NAČÍTAM...</div>
        <div style="text-align:center;">
            <div id="weight-val">0</div>
            <div style="font-size: 2rem; color: var(--yellow);">g</div>
        </div>
        <div class="side" style="text-align:right;" id="data-id">---</div>
    </div>

    <div style="text-align:center;">
        <div style="font-size: 0.7rem; letter-spacing: 5px; opacity: 0.6; margin-bottom:10px;">TOTAL LENGTH</div>
        <div class="odo-box" id="odometer"></div>
    </div>
</div>

<script>
    // TU VLOŽ SVOJU NOVÚ URL PO REDEPLOYMENTE
    const API_URL = "https://script.google.com/macros/s/AKfycbzj2tkTI5AwLSEyi-7Yvzqi8Xbms0_0zjhxgZIt_1dnXDAkM1ODX674_P9YT0XdMMiyNg/exec?action=dashboard";

    const barCont = document.getElementById('bar');
    for(let i=0; i<40; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (20 + (i * 1.8)) + 'px';
        barCont.appendChild(s);
    }

    async function updateData() {
        try {
            const res = await fetch(API_URL + "&t=" + Date.now());
            const data = await res.json();
            if (!data.rows || data.rows.length === 0) return;

            const lastRow = data.rows[data.rows.length - 1];
            
            // Konverzia dát (A=0:ID, C=2:Mat, E=4:Vaha, F=5:Dlzka)
            const idVal = lastRow[0];
            const matVal = lastRow[2];
            const vaha = Math.round(parseFloat(lastRow[4].toString().replace(',', '.'))) || 0;
            const len = Math.round(parseFloat(lastRow[5].toString().replace(',', '.'))) || 0;

            document.getElementById('weight-val').innerText = vaha;
            document.getElementById('mat-label').innerText = matVal;
            document.getElementById('data-id').innerText = "ID: " + idVal;

            // Bar Update (max 1000g)
            const segs = document.querySelectorAll('.seg');
            segs.forEach((s, i) => s.classList.toggle('on', i < (vaha/1000) * 40));

            // Odometer Update
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            len.toString().padStart(6, '0').split('').forEach(n => {
                odo.innerHTML += `<div class="digit">${n}</div>`;
            });
        } catch (e) { document.getElementById('mat-label').innerText = "API ERROR"; }
    }
    updateData(); setInterval(updateData, 10000);
</script>
</body>
</html>
