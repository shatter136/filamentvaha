<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>GSI FILAMENT DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --cyan: #00f2ff;
            --yellow: #f4d03f;
            --blue-border: #007fff;
            --glow-c: 0 0 10px var(--cyan);
            --glow-y: 0 0 15px var(--yellow), 0 0 30px rgba(244,208,63,0.5);
        }

        body { 
            background: var(--bg); 
            color: var(--cyan); 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-transform: uppercase;
        }
        
        .dashboard { 
            width: 700px; 
            padding: 40px; 
            border: 3px solid var(--blue-border); 
            box-shadow: 0 0 20px rgba(0,127,255,0.4); 
            background: #000;
        }

        /* PROGRESS BAR */
        .bar-wrapper { 
            display: flex; 
            align-items: flex-end; 
            gap: 4px; 
            height: 80px; 
            border-bottom: 2px solid var(--cyan); 
            padding-bottom: 8px; 
            margin-bottom: 10px;
        }
        .seg { flex: 1; background: #111; transition: 0.3s; }
        .seg.on { background: var(--yellow); box-shadow: var(--glow-y); }
        
        .scale { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 30px; }

        /* DATA DISPLAY */
        .main { display: flex; justify-content: space-between; align-items: center; margin: 30px 0; }
        
        #weight-val { 
            font-family: 'VT323', monospace; 
            font-size: 13rem; 
            color: var(--yellow); 
            text-shadow: var(--glow-y); 
            line-height: 0.8;
        }

        .side { width: 200px; font-size: 0.9rem; line-height: 1.5; }
        .yellow { color: var(--yellow); text-shadow: var(--glow-y); }

        /* ODOMETER */
        .odo-box { display: flex; justify-content: center; gap: 6px; margin-top: 15px; }
        .digit { 
            border: 2px solid var(--yellow); padding: 8px 12px; 
            font-size: 2.5rem; color: var(--yellow); background: #080808; 
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div style="text-align: center; letter-spacing: 10px; margin-bottom: 20px; color: var(--blue-border);">FILAMENT STATUS</div>

    <div class="bar-wrapper" id="bar-container"></div>
    <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span></div>

    <div class="main">
        <div class="side" id="mat-label">NAČÍTAM...</div>
        
        <div style="text-align: center;">
            <div id="weight-val">0</div>
            <div style="font-size: 1.5rem; letter-spacing: 5px;">GRAMS</div>
        </div>

        <div class="side" style="text-align: right;">
            <div>LENGTH: <span id="data-len" class="yellow">0</span> M</div>
            <div id="data-id" class="yellow" style="margin-top: 10px;">ID: ---</div>
        </div>
    </div>

    <div style="text-align: center;">
        <div style="font-size: 0.7rem; letter-spacing: 4px; opacity: 0.5;">TOTAL FILAMENT USED</div>
        <div class="odo-box" id="odometer"></div>
    </div>
</div>

<script>
    // SEM DAJ SVOJU NOVÚ URL PO REDEPLOYMENTE
    const API_URL = "https://script.google.com/macros/s/AKfycbzBxZLbYOGstlSyBxnw6PMK7Sx8IvGb47kFxs3CP4oTOcQG2UxsR5KFqRo6zEJ_NfX9kw/exec";

    // Vygenerovanie 35 segmentov
    const barCont = document.getElementById('bar-container');
    for(let i=0; i<35; i++) {
        let s = document.createElement('div');
        s.className = 'seg';
        s.style.height = (20 + (i * 2)) + 'px';
        barCont.appendChild(s);
    }

    async function updateData() {
        try {
            const res = await fetch(API_URL + "&t=" + Date.now());
            const data = await res.json();
            
            if (!data.rows || data.rows.length === 0) return;

            // Posledný riadok z tabuľky
            const lastRow = data.rows[data.rows.length - 1];

            // A=0:ID, C=2:Material, E=4:Vaha, F=5:Dlzka
            const idVal = lastRow[0] || "---";
            const matVal = lastRow[2] || "NEZNÁMY";
            
            // Ošetrenie čiarky z Google Sheets
            const vahaStr = lastRow[4] ? lastRow[4].toString().replace(',', '.') : "0";
            const lenStr = lastRow[5] ? lastRow[5].toString().replace(',', '.') : "0";

            const vahaNum = Math.round(parseFloat(vahaStr)) || 0;
            const lenNum = Math.round(parseFloat(lenStr)) || 0;

            // UI Update
            document.getElementById('weight-val').innerText = vahaNum;
            document.getElementById('mat-label').innerText = matVal;
            document.getElementById('data-len').innerText = lenNum;
            document.getElementById('data-id').innerText = "ID: " + idVal;

            // Bar Update (max 1000g)
            const segs = document.querySelectorAll('.seg');
            const ratio = vahaNum / 1000;
            segs.forEach((s, i) => s.classList.toggle('on', i < ratio * 35));

            // Odometer Update
            const odo = document.getElementById('odometer');
            odo.innerHTML = '';
            lenNum.toString().padStart(6, '0').split('').forEach(n => {
                odo.innerHTML += `<div class="digit">${n}</div>`;
            });

        } catch (e) {
            console.error(e);
            document.getElementById('mat-label').innerText = "CONNECTION ERROR";
        }
    }

    updateData();
    setInterval(updateData, 15000);
</script>
</body>
</html>
