<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Dashboard Fusion</title>
    <style>
        :root {
            --bg-color: #050505;
            --neon-cyan: #00f2ff;
            --neon-blue: #0080ff;
            --neon-yellow: #fff31c;
            --segment-off: #111;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }
        .dashboard {
            border: 6px solid var(--neon-blue);
            padding: 50px;
            box-shadow: 0 0 30px var(--neon-blue);
            background: none;
            text-align: center;
            min-width: 350px;
        }
        .glitch-title {
            font-size: 1.1rem;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }
        .bar-container { display: flex; gap: 6px; margin-bottom: 30px; justify-content: center; }
        .segment { width: 14px; height: 40px; background-color: var(--segment-off); border: 1px solid #222; }
        .segment.on { 
            background-image: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-yellow) 100%);
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        .stats { font-size: 4rem; font-weight: bold; margin: 15px 0; }
        #weight-val { color: var(--neon-yellow); text-shadow: 0 0 15px var(--neon-yellow); }
        #mat-label { font-size: 1.3rem; margin-bottom: 25px; display: block; }
        .data-grid { margin-top: 25px; display: grid; gap: 10px; text-align: left; border-top: 2px solid var(--neon-cyan); padding-top: 20px; }
        .data-item { font-size: 0.9rem; }
        .data-label { color: var(--neon-cyan); margin-right: 12px; font-weight: bold; }
        button { margin-top: 30px; background: none; border: 2px solid #ff00ff; color: #ff00ff; cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="glitch-title">SMART SPOOL SYSTEM</div>
        <div class="bar-container" id="pixel-bar"></div>
        <div class="main-display">
            <div class="stats"><span id="weight-val">0</span>G</div>
            <span id="mat-label">NAČÍTAM...</span>
        </div>
        <div class="data-grid">
            <div class="data-item"><span class="data-label">HEX:</span><span id="data-hex">---</span></div>
            <div class="data-item"><span class="data-label">LENGTH:</span><span id="data-len">---</span> M</div>
            <div class="data-item"><span class="data-label">ID:</span><span id="data-id">---</span></div>
        </div>
        <button onclick="resetLink()">RENASTAVIŤ LINK</button>
    </div>

    <script>
        const barContainer = document.getElementById('pixel-bar');
        for (let i = 0; i < 20; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment';
            barContainer.appendChild(seg);
        }

        function resetLink() {
            const newLink = prompt("Vlož svoj Google CSV link:");
            if (newLink) { localStorage.setItem('myCsvUrl', newLink); location.reload(); }
        }

        async function updateData() {
            const csvUrl = localStorage.getItem('myCsvUrl');
            if (!csvUrl) return;

            try {
                const response = await fetch(csvUrl + "&t=" + new Date().getTime());
                const text = await response.text();
                const allRows = text.trim().split(/\r?\n/);
                
                // Zoberieme úplne posledný riadok
                const lastRowRaw = allRows[allRows.length - 1];
                
                // Ošetrenie slovenských čiarok v číslach (napr. "795,40" -> 795.40)
                let cleanRow = lastRowRaw.replace(/"([^"]*)"/g, (match, p1) => p1.replace(',', '.'));
                const cols = cleanRow.split(',').map(item => item.replace(/"/g, '').trim());

                console.log("Dáta z tabuľky:", cols);

                // MAPOVANIE PRESNE PODĽA OBRÁZKA:
                const idDrziaka = cols[0] || "---"; // Stĺpec A
                const material  = cols[2] || "---"; // Stĺpec C
                const hexRaw    = cols[3] || "00f2ff"; // Stĺpec D
                const vahaRaw   = cols[4] || "0";   // Stĺpec E
                const metreRaw  = cols[5] || "---"; // Stĺpec F

                const vaha = parseFloat(vahaRaw);
                const hex = hexRaw.startsWith('#') ? hexRaw : '#' + hexRaw;

                // UPDATE UI
                document.getElementById('weight-val').innerText = Math.round(vaha);
                document.getElementById('mat-label').innerText = material;
                document.getElementById('data-hex').innerText = hex.toUpperCase();
                document.getElementById('data-len').innerText = metreRaw;
                document.getElementById('data-id').innerText = idDrziaka;

                // Farby a Bar
                document.documentElement.style.setProperty('--neon-cyan', hex);
                const percent = Math.min(Math.max((vaha / 1000) * 100, 0), 100);
                const activeSegments = Math.round((percent / 100) * 20);
                const segments = document.querySelectorAll('.segment');
                segments.forEach((seg, index) => {
                    if (index < activeSegments) {
                        seg.classList.add('on');
                        seg.style.boxShadow = `0 0 15px ${hex}`;
                    } else {
                        seg.classList.remove('on');
                        seg.style.boxShadow = '';
                    }
                });

            } catch (e) { console.error("Chyba:", e); }
        }

        if (!localStorage.getItem('myCsvUrl')) { setTimeout(resetLink, 500); }
        setInterval(updateData, 15000);
        updateData();
    </script>
</body>
</html>
